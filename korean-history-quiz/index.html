<script id="quiz-data" type="application/json">[{"id":1,"title":"01 제1차 세계 대전과 러시아 혁명","meta":"1 일제의 식민지 지배 정책 | 교과서 12~13쪽 | PDF 2쪽","source":"> 1 일제의 식민지 지배 정책 | 교과서 12~13쪽 | PDF 2쪽  \n> 핵심 개념: 제1차 세계 대전, 파리 강화 회의, 민족 자결주의, 러시아 혁명, 5·4 운동, 치안 유지법  \n\n### 1. 제1차 세계 대전과 전후 처리\n\n#### 1) 제1차 세계 대전\n- 배경  \n  - 제국주의 국가들이 식민지를 두고 갈등  \n  - 3국 동맹(독일, 오스트리아·헝가리, 이탈리아)와/과 3국 협상(영국, 러시아, 프랑스) 대립  \n- 전개  \n  - 연합국(협상국): 영국, 프랑스, 러시아, 일본, 중국, 미국 등  \n  - 동맹국: 독일, 오스트리아·헝가리 제국, 오스만 제국 등  \n  - 미국 참전 후 연합국 측이 유리해짐. → 독일 항복(1918)  \n\n#### 2) 전후 처리\n① 파리 강화 회의  \n- 제1차 세계 대전의 전후 처리를 위한 회의  \n- 14개조 평화 원칙: 미국 대통령 윌슨이 전후 처리 원칙으로 주장  \n  → 민족 자결주의이/가 식민 지배를 받던 약소민족에게 독립 희망, 승전국의 식민지에는 적용되지 않음.  \n\n> 한국 국민과 한국은 일본이 대한 제국을 ‘합병’하고자 1910년 8월 22일 체결한 조약을 (파리) 강화 회의에서 무효화하거나 폐지하여 한국을 일본에서 해방하고 독립 자주국으로 재건할 것을 요구합니다.  \n> — 「파리 강화 회의에 제출한 청원서」  \n\n② 베르사유 조약  \n- 독일 모든 해외 식민지 상실, 막대한 배상금  \n- 베르사유 체제: 베르사유 조약을 바탕으로 형성된 새로운 국제 질서  \n\n> [베르사유 조약(1919)]  \n> 119. 독일은 연합국과 그 협력국을 위해 해외의 모든 소유물과 권리를 포기한다.  \n> 231. 독일은 독일과 그 동맹이 일으킨 전쟁으로 연합국과 그 협력국 정부, 국민이 입은 모든 피해에 대한 책임이 독일과 그 동맹에게 있음을 받아들여야 한다.  \n\n#### 3) 러시아 혁명\n① 배경: 연합국으로 참전하였으나 잇따른 패배로 국민 불만 고조  \n\n② 전개  \n- 러시아 혁명으로 사회주의 국가인 소비에트 러시아 성립  \n- 정권을 잡은 레닌 주도로 사회주의에 따른 정책 추진  \n\n③ 소련 수립  \n- 혁명 후: 독일과 강화 조약, 코민테른 수립, 사회주의적 개혁 추진  \n- 소비에트 사회주의 공화국(소련) 수립(1922)  \n\n> [극동 인민 대표 회의 결정 사항]  \n> 조선은 농업국으로 일반 민중이 민족 운동에 공감하고 있다. 이에 계급 운동자는 독립운동을 후원하고, 임시 정부를 도와 독립 달성에 노력하여야 한다는 데 의견이 일치하였다.  \n> — 『몽양 여운형 전집』  \n\n### 2. 제1차 세계 대전 이후 동아시아의 변화\n\n#### 1) 중국\n① 일본이 중국에 21개조 요구 강요(1915)  \n\n② 5·4 운동(1919): 산둥반도 이권 반환, 21개조 요구 철폐 요구  \n\n③ 워싱턴 회의: 일본 팽창 저지, 중국 내 이해관계 조정, 해군 군비 축소 목적 → 일본은 산둥반도 이권 반환, 해군력 축소  \n\n#### 2) 일본\n① 제1차 세계 대전 중 전쟁 물자 판매로 호황 → 전후 불황 시작  \n\n② 노동 운동 및 사회주의 확산 → 일본 공산당 결성  \n\n③ 치안 유지법(1925) 제정: 일본 및 식민지 한국의 사회주의 탄압","rounds":[{"id":1,"title":"기본 개념","description":"짧은 답 10 · OX 10","guide":"1–10번은 짧은 답, 11–20번은 OX입니다.","questions":[{"type":"short","q":"제1차 세계 대전 전 독일, 오스트리아·헝가리 제국, 이탈리아가 맺은 동맹은?","answers":["3국 동맹", 빈칸에 들어갈 말을 쓰세요.\n______의 이권 반환과 21개조 요구 철폐를 요구하였다.","answers":["산둥반도"],"explanation":"5·4 운동의 요구: 산둥반도의 이권 반환과 21개조 요구 철폐를 요구하였다."},{"type":"short","q":"[워싱턴 회의의 군비 문제] 빈칸에 들어갈 말을 쓰세요.\n일본의 팽창을 저지하고 ______ 군비를 축소하려 하였다.","answers":["해군"],"explanation":"워싱턴 회의의 군비 문제: 일본의 팽창을 저지하고 해군 군비를 축소하려 하였다."},{"type":"short","q":"[일본의 전시 호황] 빈칸에 들어갈 말을 쓰세요.\n제1차 세계 대전 중 ______ 판매로 경기가 좋아졌다.","answers":["전쟁 물자"],"explanation":"일본의 전시 호황: 제1차 세계 대전 중 전쟁 물자 판매로 경기가 좋아졌다."},{"type":"short","q":"[치안 유지법의 대상] 빈칸에 들어갈 말을 쓰세요.\n일본과 식민지 한국에서 ______를 탄압하는 데 이용되었다.","answers":["사회주의"],"explanation":"치안 유지법의 대상: 일본과 식민지 한국에서 사회주의를 탄압하는 데 이용되었다."}]}]},{"id":2,"title":"02 1910년대 일제의 식민 통치","meta":"1 일제의 식민지 지배 정책 | 교과서 14~15쪽 | PDF 4쪽","source":"> 1 일제의 식민지 지배 정책 | 교과서 14~15쪽 | PDF 4쪽  \n> 핵심 개념: 조선 총독부, 무단 통치, 헌병 경찰 제도, 토지 조사 사업, 회사령  \n\n### 1. 무단 통치(헌병 경찰 통치)\n\n#### 1) 식민 통치 조직\n① 중앙: 조선 총독부  \n- 조선 총독: 식민 통치의 최고 권력자, 입법·행정·사법 및 군사권 장악, 군인 출신  \n- 정무총감(행정), 경무총감(치안), 중추원(한국인의 정치 참여 선전)  \n\n② 지방: 전국 13도 편성, 부·군·면 설치  \n\n#### 2) 헌병 경찰 통치\n① 헌병이 일반 경찰 업무와 행정 업무까지 처리  \n\n② 정식 재판 없이 한국인에게 벌금·구류 등의 처분 가능  \n\n③ 조선 태형령(1912): 한국인에 한하여 적용  \n\n> [조선 태형령]  \n> 제1조 3개월 이하의 징역 또는 구류에 처하는 자는 상황에 따라 태형에 처할 수 있다.  \n> 제7조 ① 태형은 30태 이하는 1회에 집행하고, 다시 30태까지 증가할 때마다 1회를 추가한다.  \n> 제13조 이 명령은 조선인에게만 적용한다.  \n> — 『조선 총독부 제령』 13호(1912. 3. 18.)  \n\n#### 3) 언론·집회·결사의 자유 제한\n① 언론·출판·집회·결사의 자유 제한  \n\n② 신문과 잡지 발행 금지, 각종 정치 단체 해산  \n\n#### 4) 교육\n① 식민 통치에 복종시키기 위한 교육과 일본어 보급 중시  \n\n② 보통 교육·실업 교육 위주  \n\n③ 보통학교 수업 연한 4년(일본보다 짧음.)  \n\n④ 교원에게도 제복과 칼을 착용하게 하여 위압적 분위기 조성  \n\n### 2. 1910년대 일제의 경제 침탈\n\n#### 1) 토지 조사 사업\n① 강제 병합 직후 임시 토지 조사국 설치, 토지 조사령(1912) 공포  \n\n② 목적: 명목상 근대적 토지 소유권 확립  \n  → 실제로는 토지세의 안정적 확보로 식민지 통치 자금 마련, 일본인 토지 확보 목적  \n\n③ 과정: 토지 소유주가 직접 신고하는 방식 채택  \n- 소유권 불분명한 토지를 조선 총독부 소유로 전환  \n- 동양 척식 주식회사, 일본인 농업 이주민에게 불하  \n\n④ 결과  \n- 지대 내면 경작할 수 있던 관행 부정, 소유권만 인정 → 지주 권한 강화  \n- 경작하던 토지를 잃은 농민 → 소작농 전락하거나 만주나 연해주로 이주  \n\n> [토지 조사령]  \n> 제1조 토지의 조사 및 측량은 이 명령에 따른다.  \n> 제4조 토지의 소유자는 조선 총독이 정하는 기간 내에 그 주소, 성명·명칭 및 소유지의 소재, 지목, 자번호, 사방의 경계, 등급, 지적, 결수를 임시 토지 조사 국장에게 신고하여야 한다.  \n> — 『조선 총독부 제령』 2호(1912. 8. 13.)  \n\n#### 2) 산업 및 자원 침탈\n① 회사령(1910)  \n- 회사 설립 시 조선 총독 허가 필요  \n- 한국인 자본 축적 차단, 일본의 원료 공급지 및 상품 시장화  \n\n② 어업령, 조선 광업령: 경제 활동 허가제로 전환, 자원 독점  \n\n③ 철도, 도로, 항구 건설 → 자원 수탈  \n\n> [회사령]  \n> 1. 회사의 설립은 조선 총독의 허가를 받아야 한다.  \n> 2. 조선 외에서 설립한 회사가 조선에 본점이나 지점을 설치하고자 하는 때에는 조선 총독의 허가를 받아야 한다.  \n> — 『조선 총독부 제령』 13호(1910. 12. 29.)","rounds":[{"id":1,"title":"기본 개념","description":"짧은 답 10 · OX 10","guide":"1–10번은 짧은 답, 11–20번은 OX입니다.","questions":[{"type":"short","q":"1910년대 일제의 식민 통치 방식은 무엇인가?","answers":["무단 통치","헌병 경찰 통치"],"explanation":"문서 확인: 1. 무단 통치(헌병 경찰 통치)"},{"type":"short","q":"입법·행정·사법·군사권을 장악한 식민 통치의 최고 권력자는?","answers":["조선 총독"],"explanation":"문서 확인: 조선 총독: 식민 통치의 최고 권력자, 입법·행정·사법 및 군사권 장악, 군인 출신"},{"type":"short","q":"조선 총독부에서 치안 업무를 담당한 직책은?","answers":["경무총감"],"explanation":"문서 확인: 정무총감(행정), 경무총감(치안), 중추원(한국인의 정치 참여 선전)"},{"type":"short","q":"1910년대 일제가 전국을 나눈 도의 수는?","answers":["13","13도","13개"],"explanation":"문서 확인: 지방: 전국 13도 편성, 부·군·면 설치"},{"type":"short","q":"헌병이 일반 경찰 업무까지 담당한 제도는?","answers":["헌병 경찰 제도","헌병 경찰제"],"explanation":"헌병 경찰 제도 아래 헌병은 일반 경찰 업무와 행정 업무까지 맡았다."},{"type":"short","q":"1912년 한국인에게만 적용한 태형 관련 법령은?","answers":["조선 태형령"],"explanation":"문서 확인: 조선 태형령(1912): 한국인에 한하여 적용"},{"type":"short","q":"1910년대 보통학교의 수업 연한은 몇 년이었는가?","answers":["4","4년"],"explanation":"문서 확인: 보통학교 수업 연한 4년(일본보다 짧음.)"},{"type":"short","q":"1912년 토지 조사 사업의 근거로 공포한 법령은?","answers":["토지 조사령"],"explanation":"문서 확인: 강제 병합 직후 임시 토지 조사국 설치, 토지 조사령(1912) 공포"},{"type":"short","q":"조선 총독부 소유로 바뀐 토지를 불하받은 대표적 일본 회사는?","answers":["동양 척식 주식회사"],"explanation":"문서 확인: 동양 척식 주식회사, 일본인 농업 이주민에게 불하"},{"type":"short","q":"1910년 회사 설립에 총독의 허가를 받도록 한 법령은?","answers":["회사령"],"explanation":"회사령은 회사 설립에 조선 총독의 허가를 받도록 규정하였다."},{"type":"ox","q":"조선 총독은 군인 출신이었다.","answers":["O"],"explanation":"1910년대 총독은 군인 출신으로 광범위한 권력을 행사하였다."},{"type":"ox","q":"중추원은 한국인의 정치 참여를 선전하는 데 이용되 말을 쓰세요.\n토지 ______가 직접 토지 정보를 신고해야 하였다.","answers":["소유주","소유자"],"explanation":"토지 소유 신고 방식: 토지 소유주가 직접 토지 정보를 신고해야 하였다."},{"type":"short","q":"[소유권 불분명 토지의 처리] 빈칸에 들어갈 말을 쓰세요.\n소유권이 명확하지 않은 토지를 ______ 소유로 전환하였다.","answers":["조선 총독부"],"explanation":"소유권 불분명 토지의 처리: 소유권이 명확하지 않은 토지를 조선 총독부 소유로 전환하였다."},{"type":"short","q":"[토지 조사 사업과 지주] 빈칸에 들어갈 말을 쓰세요.\n관행적 경작을 부정하고 ______만 인정하여 지주의 권한을 강화하였다.","answers":["소유권"],"explanation":"토지 조사 사업과 지주: 관행적 경작을 부정하고 소유권만 인정하여 지주의 권한을 강화하였다."},{"type":"short","q":"[농민의 국외 이주] 빈칸에 들어갈 말을 쓰세요.\n경작하던 토지를 잃은 농민 일부는 만주나 ______로 이주하였다.","answers":["연해주"],"explanation":"농민의 국외 이주: 경작하던 토지를 잃은 농민 일부는 만주나 연해주로 이주하였다."},{"type":"short","q":"[회사령의 설립 조건] 빈칸에 들어갈 말을 쓰세요.\n회사를 세우려면 ______의 허가를 받아야 하였다.","answers":["조선 총독","총독"],"explanation":"회사령의 설립 조건: 회사를 세우려면 조선 총독의 허가를 받아야 하였다."},{"type":"short","q":"[어업령·조선 광업령] 빈칸에 들어갈 말을 쓰세요.\n관련 경제 활동을 ______로 바꾸어 자원을 독점하였다.","answers":["허가제"],"explanation":"어업령·조선 광업령: 관련 경제 활동을 허가제로 바꾸어 자원을 독점하였다."}]}]},{"id":3,"title":"03 1920년대 일제의 식민 통치","meta":"1 일제의 식민지 지배 정책 | 교과서 16~17쪽 | PDF 6쪽","source":"> 1 일제의 식민지 지배 정책 | 교과서 16~17쪽 | PDF 6쪽  \n> 핵심 개념: ‘문화 정치’, 치안 유지법, 산미 증식 계획, 회사령 폐지, 관세 철폐  \n\n### 1. ‘문화 정치’(민족 분열 통치)\n\n#### 1) 통치 방식의 변화\n① 배경: 3·1 운동으로 무단 통치의 한계를 인식함.  \n\n② 목적: ‘문화 정치’를 내세워 한국인 반발 무마  \n\n> [‘문화 정치’]  \n> 문관과 무관 중에서 조선 총독을 임용할 수 있도록 하겠다. 헌병 경찰 제도는 보통 경찰 제도로 바꿀 것이다. 일반 관리와 교원의 제복과 칼 착용을 폐지하며, 조선인의 임용과 대우를 고려할 것이다.  \n> — 『조선 총독부 관보』 제2121호(1919. 9. 4.)  \n\n#### 2) 기만적 민족 분열 통치의 실상\n- 조선 총독  \n  - 표면적 내용: 문관 총독 임명 가능  \n  - 실제 내용: 실제로 임명된 적 없음.  \n- 경찰 및 복제  \n  - 표면적 내용:  \n    - 헌병 경찰제 → 보통 경찰제  \n    - 관리, 교원의 제복 및 칼 착용 폐지  \n  - 실제 내용:  \n    - 경찰과 경찰 기관 수 크게 증가  \n    - 치안 유지법(1925) 제정 → 사회주의 운동, 민족 운동 억압  \n- 정치 참여  \n  - 표면적 내용:  \n    - 도평의회, 부·면 협의회 설치  \n    - 일부 한국인에 선거권 부여  \n  - 실제 내용:  \n    - 실권 없는 자문 기관  \n    - 선거권은/는 극히 일부 한국인에게 부여  \n- 언론  \n  - 표면적 내용:  \n    - 언론·출판·집회·결사의 자유 일부 허용  \n    - 『조선일보』, 『동아일보』 발행 허용  \n  - 실제 내용: 검열, 삭제, 정간·폐간 등으로 탄압  \n- 교육  \n  - 표면적 내용:  \n    - 보통학교 교육 연한 일본과 같은 6년으로 확대  \n    - 학교 수 증가  \n  - 실제 내용:  \n    - 학교 수 여전히 부족  \n    - 한국인 취학률 매우 낮음.  \n\n### 2. 1920년대 일제의 경제 침탈\n\n#### 1) 산미 증식 계획\n① 목적: 일본의 부족한 식량을 한국에서 확보하려고 실시  \n\n② 배경: 일본 인구 증가, 제1차 세계 대전 영향으로 경제 성장 → 쌀 소비량 증가, 농민들이 일자리를 찾아 도시로 떠나면서 쌀 생산 감소 → 쌀값 폭등, 폭동 발생  \n\n③ 내용: 1920년부터 실시 → 농지 확장, 신품종 도입, 수리 시설 개선  \n\n④ 결과  \n- 쌀 생산량 증가, 지속적으로 많은 양의 쌀이 일본으로 유출 → 한국인의 쌀 소비량 감소 → 부족한 식량 문제 만주에서 잡곡 수입하여 보충  \n- 농민 몰락: 수리 시설 개선비 등 농민 전가 → 소작농, 화전민, 도시 임노동자, 국외 이주  \n- 일부 지주들은 쌀을 판매하여 큰 이득을 거두기도 함.  \n\n> [산미 증식 계획의 목적]  \n> 일본의 인구는 해마다 약 70만 명이 증가하고 있을 뿐만 아니라 국민 생활이 향상하면 1인당 쌀 소비량도 역시 점차 증가할 것이 분명하다. 이러한 상황을 볼 때 앞으로 쌀의 공급은 더욱 부족할 것이다. 그러므로 지금 쌀의 증식 계획을 수립하여 자국 식량 문제 해결의 바탕으로 삼는 것이 진실로 국가 정책상 긴급하고 중요한 임무라고 믿는다.  \n> — 조선 총독부, 『산미 증식 계획 요강』  \n\n#### 2) 일본 자본 한국 침투\n① 회사령 폐지(1920): 허가제 → 신고제 전환  \n- 제1차 세계 대전 이후 호황으로 자본 축적한 일본 기업이 값싼 자원과 노동력을 찾아 한국에 들어옴.  \n- 한국인 기업 설립 증가했으나 자본과 규모에서 열세  \n\n② 일본 상품의 관세 철폐(1923): 값싼 일본 상품 유입, 한국인 기업 타격","rounds":[{"id":1,"title":"기본 개념","description":"짧은 답 10 · OX 10","guide":"1–10번은 짧은 답, 11–20번은 OX입니다.","questions":[{"type":"short","q":"일제가 무단 통치의 한계를 깨닫게 된 1919년의 운동은?","answers":["3·1 운동","삼일 운동"],"explanation":"문서 확인: 배경: 3·1 운동으로 무단 통치의 한계를 인식함."},{"type":"short","q":"1920년대 일제가 내세운 통치 방식의 이름은?","answers":["문화 정치","문화 통치"],"explanation":"문서 확인: 1. ‘문화 정치’(민족 분열 통치)"},{"type":"short","q":"헌병 경찰제를 대신하여 도입한 제도는?","answers":["보통 경찰제","보통 경찰 제도"],"explanation":"문서 확인: 문관과 무관 중에서 조선 총독을 임용할 수 있도록 하겠다. 헌병 경찰 제도는 보통 경찰 제도로 바꿀 것이다. 일반 관리와 교원의 제복과 칼 착용을 폐지하며, 조선인의 임용과 대우를 고려할 것이다."},{"type":"short","q":"1925년 사회주의 운동과 민족 운동을 억압하기 위해 제정한 법은?","answers":["치안 유지법"],"explanation":"문서 확인: 치안 유지법(1925) 제정 → 사회주의 운동, 민족 운동 억압"},{"type":"short","q":"도평의회와 부·면 협의회는 실권 없는 어떤 성격의 기관이었는가?","answers":["자문","자문 기관"],"explanation":"문서 확인: 실권 없는 자문 기관"},{"type":"short","q":"1920년대 보통학교 교육 연한은 몇 년으로 확대되었는가?","answers":["6","6년"],"explanation":"문서 확인: 보통학교 교육 연한 일본과 같은 6년으로 확대"},{"type":"short","q":"일본의 부족한 식량을 한국에서 확보하려고 실시한 계  이전의 민족 운동","meta":"2 3·1 운동과 대한민국 임시 정부 | 교과서 20~21쪽 | PDF 8쪽","source":"> 2 3·1 운동과 대한민국 임시 정부 | 교과서 20~21쪽 | PDF 8쪽  \n> 핵심 개념: 독립 의군부, 대한 광복회, 북로 군정서, 신흥 무관 학교  \n\n### 1. 1910년대 국내의 민족 운동\n\n#### 1) 상황\n① 일제의 가혹한 무단 통치  \n\n② 105인 사건 조작과 독립운동 탄압  \n\n#### 2) 민족 운동의 전개: 의병 운동, 비밀 결사의 형태로 지속\n① 채응언: 의병장, 서북 지방에서 1915년까지 활동  \n\n② 독립 의군부(1912)  \n- 인물  \n  - 의병장 출신 임병찬과 각지의 유생들  \n- 특징  \n  - 고종의 비밀 지시를 받고 조직, 복벽주의  \n- 활동  \n  - 의병 전쟁 계획, 국권 반환 요구서 발송 → 조직 발각되어 해체  \n\n③ 대한 광복회(1915)  \n- 인물  \n  - 박상진이/가 대구에서 조직  \n- 특징  \n  - 공화제 정부 수립 목표  \n- 활동  \n  - 군대식 조직, 사관 학교 설립 추진 목표, 군자금 마련을 위하여 친일파 처단, 광산 및 우편물 수송 차량 습격  \n- 해체  \n  - 군자금 모집 과정에서 일제에 발각되어 해체, 김좌진 등 간도 이동  \n\n④ 송죽회  \n- 인물  \n  - 평양 숭의 여학교 교사와 학생들  \n- 활동  \n  - 국외 망명 독립운동가 가족에 도움 제공, 독립운동 자금 후원  \n\n> [대한 광복회 강령]  \n> 1. 부호의 의연금과 일본인이 불법 징수한 세금을 압수하여 무장을 준비함.  \n> 2. 남북 만주에 사관 학교를 세우고 인재를 키워 사관으로 채용함.  \n> 7. 무력이 준비되는 대로 일본인 섬멸전을 단행하여 최후 목적을 이룸.  \n> — 광복회 본부, 『광복회』  \n\n### 2. 1910년대 국외의 민족 운동\n\n#### 1) 독립 준비: 한국인 사회를 바탕으로 독립 준비\n\n#### 2) 지역별 주요 단체\n- 북간도  \n  - 주요 지역: 옌지, 룽징, 왕칭  \n  - 자치 기구: 간민회  \n  - 군사 단체: 중광단(대종교) → 북로 군정서  \n  - 민족 학교: 서전서숙, 명동 학교  \n- 서간도  \n  - 주요 지역: 삼원보(이회영 형제 등 신민회 회원들 주도)  \n  - 자치 기구: 경학사  \n  - 군사 단체·민족 학교: 신흥 강습소(이후 신흥 무관 학교) 설립 → 독립군 양성(관련 인물: 지청천, 이범석)  \n- 연해주  \n  - 주요 지역: 블라디보스토크(신한촌)  \n  - 자치 기구·군사 단체·민족 학교:  \n    - 권업회 → 대한 광복군 정부 수립(이상설, 이동휘)  \n    - 대한 국민 의회  \n    - 러시아 혁명 이후 한인 사회당 조직(이동휘 등)  \n- 미주  \n  - 주요 지역: 하와이  \n  - 자치 기구·군사 단체·민족 학교:  \n    - 대한인 국민회: 안창호 중심, 만주와 연해주 지역의 독립운동 지원  \n    - 대조선 국민 군단: 박용만 중심, 군사 훈련 실시","rounds":[{"id":1,"title":"기본 개념","description":"짧은 답 10 · OX 10","guide":"1–10번은 짧은 답, 11–20번은 OX입니다.","questions":[{"type":"short","q":"일제가 조작하여 독립운동을 탄압한, 숫자가 들어가는 사건은?","answers":["105인 사건"],"explanation":"문서 확인: 105인 사건 조작과 독립운동 탄압"},{"type":"short","q":"1915년까지 서북 지방에서 활동한 의병장은?","answers":["채응언"],"explanation":"문서 확인: 채응언: 의병장, 서북 지방에서 1915년까지 활동"},{"type":"short","q":"임병찬 등이 1912년 조직한 복벽주의 단체는?","answers":["독립 의군부"],"expl 하와이에서 ______을 중심으로 군사 훈련을 실시하였다.","answers":["박용만"],"explanation":"대조선 국민 군단의 지도자: 하와이에서 박용만을 중심으로 군사 훈련을 실시하였다."}]}]},{"id":5,"title":"02 3·1 운동","meta":"2 3·1 운동과 대한민국 임시 정부 | 교과서 22~25쪽 | PDF 10쪽","source":"> 2 3·1 운동과 대한민국 임시 정부 | 교과서 22~25쪽 | PDF 10쪽  \n> 핵심 개념: 민족 자결주의, 2·8 독립 선언, 3·1 운동  \n\n### 1. 3·1 운동의 배경\n\n#### 1) 국제 정세 변화\n① 러시아 혁명(1917) → 사회주의 정권 수립, 레닌의 식민지 민족 독립운동 지원 선언  \n\n② 민족 자결주의 원칙 발표  \n- 발표  \n  - 제1차 세계 대전 중 미국 대통령 윌슨이 14개조 평화 원칙 발표, 민족 자결주의 포함  \n- 의미  \n  - 각 민족이 다른 민족의 간섭을 받지 않고 스스로 정치적 운명을 결정할 수 있다는 사상  \n\n#### 2) 독립 선언의 준비\n① 해외의 움직임  \n- 상하이  \n  - 신한청년당이/가 파리 강화 회의에 김규식을 대표로 파견  \n- 연해주  \n  - 파리에 대표단 파견  \n- 만주  \n  - 조소앙 등 독립 선언 준비  \n- 일본  \n  - 일본 유학생들이 중심이 되어 2·8 독립 선언(1919. 2. 8.)  \n\n② 국내의 움직임  \n- 1919년 1월, 고종 사망 이후 독살설이 퍼지면서 반일 감정 고조  \n- 천도교, 기독교, 불교 등 종교 지도자와 학생 대표들이 독립 선언 계획  \n\n### 2. 3·1 운동의 전개\n\n- 발단  \n  - 독립 선언서 발표: 손병희, 이승훈, 한용운 등 민족 대표  \n    → 시위 과격화를 우려, 서울 종로 태화관에서 낭독 후 자진 체포  \n  - 탑골 공원: 군중 중 한 명이 독립 선언서 낭독 후 시위 전개  \n- 국내  \n  - 서울, 원산, 평양 등의 대도시에서 중소 도시와 농촌으로 확산  \n  - 시위 주도 세력: 학생과 시민 → 노동자와 농민, 시위 조직화  \n  - 일제의 가혹한 탄압, 제암리 사건 등 → 무력 저항으로 변화  \n- 국외  \n  - 간도, 연해주, 일본 도쿄, 오사카, 중국 상하이에서 만세 시위  \n  - 미국 필라델피아: 독립 선언서 낭독, 태극기 흔들며 시가행진  \n\n> [기미 독립 선언서(1919)]  \n> 우리는 지금 우리 조선이 독립한 나라이고 조선 사람이 자주적인 국민이라는 것을 선언하노라. 이 사실을 세계 여러 나라에 알려서 인류 평등이라는, 사람이라면 마땅히 지켜야 할 도리를 분명히 밝히고, 후손들에게 대대로 전하여 민족의 독자적 생존이라는 정당한 권리를 영원히 누릴 수 있도록 하는 바이다.  \n\n추가 자료) 일제의 제암리 사건 기록  \n\n> 4월 15일 오후 4시를 지나 일본 수비대의 대장인 모 중위와 병사가 명령을 받고 기독교, 천도교도인 마을 사람 20여 명을 같은 마을 교회당에 소집해 그 기독교도인 이유를 물어 외부에서 발포하였다. 교회 안의 교인 여러 명과 도망치는 사람을 사살한 뒤 교회당에 불을 놓아 남은 교인 전부를 태워 죽였다. 그 후 다시 마을 각지에 방화해 20여 호를 전부 태웠다.  \n> — 『일제 외무성 자료에 기록된 제암리 사건』  \n\n### 3. 3·1 운동의 의의 및 영향\n\n#### 1) 의의\n① 거국적 민족 운동: 학생과 시민이 시작하여 일제의 가혹한 탄압에도 남녀노소 모두 참여  \n\n② 일제 강점기 최대 규모 독립운동: 전 세계에 흩어진 한국인을 결집  \n\n#### 2) 영향\n① 대한민국 임시 정부 수립: 우리 역사 최초의 민주 공화제 정부  \n\n② 민족 운동 주체 확대: 학생, 시민, 노동자, 농민 등으로 확대  \n\n③ 다양한 사회 운동 촉진: 농민 운동, 노동 운동 활성화  \n\n④ 세계사적 영향: 중국의 5·4 운동과 세계 약소민족의 반제국주의 운동에 영향  \n\n⑤ 일제의 통치 방식 변화: 무단 통치 → ‘문화 정치’","rounds":[{"id":1,"title":"기본 개념","description":"짧은 답 10 · OX 10","guide":"1–10번은 짧은 답, 11–20번은 OX입니다.","questions":[{"type":"short","q":"각 민족이 스스로 정치적 운명을 결정할 수 있다는 사상은?","answers":["민족 자결주의"],"explanation":"문서 확인: 제1차 세계 대전 중 미국 대통령 윌슨이 14개조 평화 원칙 발표, 민족 자결주의 포함"},{"type":"short","q":"민족 자결주의를 포함한 14개조 평화 원칙을 발표한 미국 대통령은?","answers":["윌슨"],"explanation":"문서 확인: 제1차 세계 대전 중 미국 대통령 윌슨이 14개조 평화 원칙 발표, 민족 자결주의 포함"},{"type":"short","q":"상하이에서 김규식을 파리 강화 회의에 파견한 단체는?","answers":["신한청년당"],"explanation":"문서 확인: 신한청년당이/가 파리 강화 회의에 김규식을 대표로 파견"},{"type":"short","q":"1919년 일본 유학생들이 발표한 독립 선언은?","answers":["2·8 독립 선언","2월 8일 독립 선언"],"explanation":"문서 확인: 일본 유학생들이 중심이 되어 2·8 독립 선언(1919. 2. 8.)"},{"type":"short","q":"1919년 1월 사망하여 독살설이 퍼진 인물은?","answers":["고종"],"explanation":"문서 확인: 1919년 1월, 고종 사망 이후 독살설이 퍼지면서 반일 감정 고조"},{"type":"short","q":"민족 대표들이 독립 선언서를 낭독한 서울 종로의 장소는?","answers":["태화관"],"explanation":"문서 확인: → 시위 과격화를 우려, 서울 종로 태화관에서 낭독 후 자진 체포"},{"type":"short","q":"서울에서 군중이 독립 선언서를 낭독하고 시위를 시작한 공원은?","answers":["탑골 공원","탑골"],"explanation":"문서 확인: 탑골 공원: 군중 중 한 명이 독립 선언서 낭독 후 시위 전개"},{"type":"short","q":"일본군이 주민을 교회에 모아 학살하고 방화한 사건은?","answers":["제암리 사건","제암리 학살 사건"],"explanation":"문서 확인: 일제의 가혹한 탄압, 제암리 사건 등 → 무력 저항으로 변화"},{"type":"short","q":"3·1 운동의 영향으로 수립된 우리 역사 최초의 민주 공화제 정부는?","answers":["대한민국 임시 정부"],"explanation":"문서 확인: 대한민국 임시 정부 수립: 우리 역사 최초의 민주 공화제 정부"},{"type":"short","q":"3·1 운동의 영향을 받은 1919년 중국의 민족 운동은?","answers":["5·4 운동","5월 4일 운동"],"explanation":"문서 확인: 세계사적 영향: 중국의 5·4 운동과 세계 약소민족의 반제국주의 운동에 영향"},{"type":"ox","q":"러시아 혁명과 민족 자결주의는 3·1 운동의 국제적 배경이었다.","answers":["O"],"explanation":"국제 정세 변화는 식민지 민족의 독립에 대한 기대를 높였다."},{"type":"ox","q":"국내 독립 선언 준비에는 종교 지도자와 학생 대표들이 참여하였다.","answers":["O"],"explanation":"천도교·기독교·불교 지도자와 학생들이 독립 선언을 계획하였다."},{"type":"ox","q":"민족 대표들은 태화관에서 선언서를 낭독한 뒤 자진 체포되었다.","answers":["O"],"explanation":"시위의 과격화를 우려하여 태화관에서 선언서를 낭독하였다."},{"type":"ox","q":"3·1 운동은 농촌에서만 일어났고 대도시에는 퍼지지 않았다.","ans :"short","q":"[제암리 사건의 장소] 빈칸에 들어갈 말을 쓰세요.\n일본군은 주민을 ______에 모아 공격하고 불을 질렀다.","answers":["교회","교회당"],"explanation":"제암리 사건의 장소: 일본군은 주민을 교회에 모아 공격하고 불을 질렀다."},{"type":"short","q":"[미주 지역의 시위] 빈칸에 들어갈 말을 쓰세요.\n미국 ______에서 독립 선언서를 낭독하고 시가행진을 하였다.","answers":["필라델피아"],"explanation":"미주 지역의 시위: 미국 필라델피아에서 독립 선언서를 낭독하고 시가행진을 하였다."},{"type":"short","q":"[중국 내 한인 시위] 빈칸에 들어갈 말을 쓰세요.\n중국 ______에서도 한인들의 만세 시위가 일어났다.","answers":["상하이"],"explanation":"중국 내 한인 시위: 중국 상하이에서도 한인들의 만세 시위가 일어났다."},{"type":"short","q":"[기미 독립 선언서의 선언] 빈칸에 들어갈 말을 쓰세요.\n조선이 독립한 나라이고 조선인이 ______임을 밝혔다.","answers":["자주적인 국민","자주적 국민"],"explanation":"기미 독립 선언서의 선언: 조선이 독립한 나라이고 조선인이 자주적인 국민임을 밝혔다."},{"type":"short","q":"[거국적 민족 운동] 빈칸에 들어갈 말을 쓰세요.\n학생·시민을 비롯한 ______가 폭넓게 참여하였다.","answers":["남녀노소"],"explanation":"거국적 민족 운동: 학생·시민을 비롯한 남녀노소가 폭넓게 참여하였다."},{"type":"short","q":"[새 정부 수립에 준 영향] 빈칸에 들어갈 말을 쓰세요.\n대한민국 임시 정부라는 최초의 ______ 정부 수립으로 이어졌다.","answers":["민주 공화제"],"explanation":"새 정부 수립에 준 영향: 대한민국 임시 정부라는 최초의 민주 공화제 정부 수립으로 이어졌다."},{"type":"short","q":"[중국 민족 운동에 준 영향] 빈칸에 들어갈 말을 쓰세요.\n1919년 중국의 ______에도 영향을 주었다.","answers":["5·4 운동","5월 4일 운동"],"explanation":"중국 민족 운동에 준 영향: 1919년 중국의 5·4 운동에도 영향을 주었다."}]}]},{"id":6,"title":"03 대한민국 임시 정부","meta":"2 3·1 운동과 대한민국 임시 정부 | 교과서 26~27쪽 | PDF 12쪽","source":"> 2 3·1 운동과 대한민국 임시 정부 | 교과서 26~27쪽 | PDF 12쪽  \n> 핵심 개념: 대한민국 임시 정부, 연통제, 교통국, 국민 대표 회의  \n\n### 1. 대한민국 임시 정부의 수립\n\n#### 1) 여러 임시 정부 통합\n① 한성 정부 법통을 계승해 상하이 대한민국 임시 정부, 대한 국민 의회 통합  \n\n② 정부 이름 대한민국 임시 정부로 결정, 상하이 위치  \n\n#### 2) 특징\n① 임시 의정원이 대한민국 임시 헌법 공포(1919. 9.)  \n\n② 이승만 대통령, 이동휘 국무총리 선출  \n\n추가 자료) 대한민국 임시 헌법(1919. 9.)  \n\n> 제1조 대한민국은 대한 인민으로 조직한다.  \n> 제2조 대한민국의 주권은 대한 인민 전체에 있다.  \n> 제4조 대한민국의 인민은 일체 평등하다.  \n> 제5조 대한민국의 입법권은 의정원이, 행정권은 국무원이, 사법권은 법원이 행사한다.  \n> 제8조 대한민국의 인민은 법률 범위 내에서 다음 각 항에 제시된 자유를 향유한다.  \n> 1. 신앙의 자유 2. 재산의 자유 3. 언론·저작·출판·집회·결사의 자유  \n\n### 2. 대한민국 임시 정부의 활동\n\n- 특징  \n  - 우리 역사 최초 민주 공화제 정부  \n  - 삼권 분립: 임시 의정원(입법), 법원(사법), 국무원(행정)  \n- 조직 정비  \n  - 비밀 행정 조직인 연통제, 통신 기관인 교통국 설치  \n  - 독립 공채·의연금 등으로 자금 조달  \n  - 기관지인 『독립신문』이/가 독립운동 소식 전달, 『한·일 관계 사료집』 간행  \n- 외교 활동  \n  - 파리 강화 회의에 파견된 김규식을 외무 총장으로 임명 → 독립 청원서 제출  \n  - 구미 위원부: 이승만을 중심으로 외교 활동 전개  \n- 군사 활동  \n  - 국무원 산하에 군무부 설치: 군사 업무 관장  \n  - 광복군 사령부와 광복군 총영 등 설치, 이후 육군 주만 참의부 편성  \n  - 미국에 한인 비행사 양성소 설치  \n\n### 3. 대한민국 임시 정부의 변화\n\n#### 1) 국민 대표 회의\n① 배경  \n- 연통제와 교통국이 일제에 발각 → 재정난  \n- 독립운동의 방법론을 둘러싼 대립  \n\n② 개최: 1923년 상하이에서 개최  \n\n③ 결렬: 개조파와 창조파 대립으로 결렬  \n\n추가 자료) 임시 정부 개편에 대한 서로 다른 시각  \n\n> 창조파 3·1 혁명(3·1 운동) 때 정부가 있었으나 실권이 없고 이름뿐이므로 전민족적 운동의 최고 기구가 아니다. 지금 두 파가 있으나 최고 권위를 가진 본 회의(국민 대표 회의)가 정부와 대립하지 말고 정부를 새롭게 조직하면 될 일이다.  \n>\n> 개조파 5년간 내외가 공인하고, 다수 국민이 받들던 기성 정부를 구태여 없이 하고 새것을 창조할 것 없이 기존 정부를 여러 의견에 맡겨 개조하자.  \n\n#### 2) 대한민국 임시 정부의 변화\n① 침체: 국민 대표 회의 이후 대한민국 임시 정부 침체  \n\n② 영향: 이승만 대통령 탄핵 → 박은식 대통령 → 국무령 중심의 집단 지도 체제 전환(1925)  \n\n> [이승만 대통령 탄핵]  \n> 대통령 이승만을 면직함. …… 난국 수습과 대업 진행에 성의를 다하지 않을 뿐 아니라, 허황된 사실을 퍼뜨려 정부의 위신을 손상하고 민심을 분산시킴은 물론, 정부의 행정과 국고 수입을 방해하였고, 의정원의 신성을 모독하고, 공적 결의를 부인하였으며, 심지어 정부까지 부인한 것이 사실이다.  \n> — 『대한민국 임시 정부 공보』 제42호(1925)","rounds":[{"id":1,"title":"기본 개념","description":"짧은 답 10 · OX 10","guide":"1–10번은 짧은 답, 11–20번은 OX입니다.","questions":[{"type":"short","q":"통합된 대한민국 임시 정부가 법통을 계승한 정부는?","answers":["한성 정부"],"explanation":"문서 확인: 한성 정부 법통을 계승해 상하이 대한민국 임시 정부, 대한 국민 의회 통합"},{"type":"short","q":"통합된 대한민국 임시 정부가 자리 잡은 중국 도시는?","answers":["상하이"],"explanation":"문서 확인: 한성 정부 법통을 계승해 상하이 대한민국 임시 정부, 대한 국민 의회 통합"},{"type":"short","q":"1919년 임시 정부의 대통령으로 선출된 인물은?","answers":["이승만"],"explanation":"문서 확인: 이승만 대통령, 이동휘 국무총리 선출"},{"type":"short","q":"1919년 임시 정부의 국무총리로 선출된 인물은?","answers":["이동휘"],"explanation":"문서 확인: 이승만 대통령, 이동휘 국무총리 선출"},{"type":"short","q":"입법·행정·사법 권력을 나누는 원칙은?","answers":["삼권 분립"],"explanation":"문서 확인: 삼권 분립: 임시 의정원(입법), 법원(사법), 국무원(행정)"},{"type":"short","q":"임시 정부가 국내에 설치한 비밀 행정 조직은?","answers":["연통제"],"explanation":"문서 확인: 비밀 행정 조직인 연통제, 통신 기관인 교통국 설치"},{"type":"short","q":"임시 정부의 통신 기관은?","answers":["교통국"],"explanation":"문서 확인: 비밀 행 동 소식을 전하였다.","answers":["독립신문"],"explanation":"기관지 발행: 임시 정부는 『독립신문』을 통해 독립운동 소식을 전하였다."},{"type":"short","q":"[역사 자료집 간행] 빈칸에 들어갈 말을 쓰세요.\n일본과의 관계를 다룬 『______』을 펴냈다.","answers":["한·일 관계 사료집","한일 관계 사료집"],"explanation":"역사 자료집 간행: 일본과의 관계를 다룬 『한·일 관계 사료집』을 펴냈다."},{"type":"short","q":"[김규식의 외교 활동] 빈칸에 들어갈 말을 쓰세요.\n외무 총장으로 임명되어 파리 강화 회의에 독립 ______를 제출하였다.","answers":["청원서"],"explanation":"김규식의 외교 활동: 외무 총장으로 임명되어 파리 강화 회의에 독립 청원서를 제출하였다."},{"type":"short","q":"[구미 위원부의 중심 인물] 빈칸에 들어갈 말을 쓰세요.\n______을 중심으로 외교 활동을 전개하였다.","answers":["이승만"],"explanation":"구미 위원부의 중심 인물: 이승만을 중심으로 외교 활동을 전개하였다."},{"type":"short","q":"[군무부의 위치] 빈칸에 들어갈 말을 쓰세요.\n______ 산하에 설치되어 군사 업무를 맡았다.","answers":["국무원"],"explanation":"군무부의 위치: 국무원 산하에 설치되어 군사 업무를 맡았다."},{"type":"short","q":"[비행사 양성] 빈칸에 들어갈 말을 쓰세요.\n임시 정부는 ______에 한인 비행사 양성소를 설치하였다.","answers":["미국"],"explanation":"비행사 양성: 임시 정부는 미국에 한인 비행사 양성소를 설치하였다."},{"type":"short","q":"[국민 대표 회의의 개최지] 빈칸에 들어갈 말을 쓰세요.\n1923년 중국 ______에서 독립운동의 방향을 논의하였다.","answers":["상하이"],"explanation":"국민 대표 회의의 개최지: 1923년 중국 상하이에서 독립운동의 방향을 논의하였다."},{"type":"short","q":"[개조파의 주장] 빈칸에 들어갈 말을 쓰세요.\n기존 ______를 유지하면서 개편하자고 주장하였다.","answers":["임시 정부","대한민국 임시 정부"],"explanation":"개조파의 주장: 기존 임시 정부를 유지하면서 개편하자고 주장하였다."},{"type":"short","q":"[창조파의 주장] 빈칸에 들어갈 말을 쓰세요.\n기존 정부 대신 정부를 ______하자고 주장하였다.","answers":["새롭게 조직","새로 조직"],"explanation":"창조파의 주장: 기존 정부 대신 정부를 새롭게 조직하자고 주장하였다."}]}]},{"id":7,"title":"01 무장 독립 투쟁과 의열 투쟁","meta":"3 다양한 민족 운동의 전개 | 교과서 30~33쪽 | PDF 14쪽","source":"> 3 다양한 민족 운동의 전개 | 교과서 30~33쪽 | PDF 14쪽  \n> 핵심 개념: 봉오동 전투, 청산리 대첩, 간도 참변, 3부, 미쓰야 협정, 의열단, 한인 애국단  \n\n### 1. 독립군의 활동\n\n#### 1) 배경: 3·1 운동이 일제의 탄압으로 목적을 이루지 못하자 무력 투쟁 움직임이 나타남.\n\n#### 2) 활동\n① 봉오동 전투(1920. 6.)  \n- 만주 일대 독립군 부대들이 국내에 진입하여 일제의 식민 통치 기관 파괴  \n- 일제가 추격 부대 편성해 독립군 근거지 수색·탄압하려 함.  \n- 홍범도의 대한 독립군, 최진동의 군무 도독부, 안무의 국민회군 등 독립군 연합 부대가 일본군 기습 공격, 봉오동에서 대승을 거둠.  \n\n② 청산리 대첩(1920. 10.)  \n- 배경: 봉오동 전투 이후 일제가 훈춘 사건을/를 구실로 대군 동원  \n- 전투: 북간도 지역에 있던 김좌진의 북로 군정서, 홍범도의 대한 독립군 등이 연합하여 백두산으로 이동, 일본군을 청산리 일대로 유인해 승리  \n\n#### 3) 시련\n① 간도 참변: 봉오동 전투 등 패배 보복, 간도 한인 학살  \n\n② 자유시 참변  \n- 대한 독립 군단이 일본군 피해 러시아 자유시(스보보드니) 집결  \n- 주도권 다툼, 러시아 적군의 무장 해제 및 발포로 피해  \n\n### 2. 3부의 성립과 통합\n\n- 3부 성립  \n  - 만주 지역에 참의부, 정의부, 신민부 편성  \n  - 민정 및 군정 조직 갖춘 공화주의 자치 정부  \n- 미쓰야 협정  \n  - 일제가 독립군 탄압 위해 만주 지역 군벌과 체결  \n- 3부 통합  \n  - 민족 유일당 운동 영향으로 3부 통합 운동 전개  \n  - 국민부(남만주)가 조선 혁명당, 혁신 의회(북만주)가 한국 독립당으로 개편  \n\n> [미쓰야 협정]  \n> 1. 중국 관리는 재중 한국인의 호구를 엄격히 조사하고 연대 책임제로 단속한다.  \n> 2. 중국 관리는 각 현에 알려 재류 한국인이 무기를 휴대하고 조선에 침입하는 것을 엄히 금한다. 어긴 자는 체포하여 조선 관리(일제의 군경)에게 인도한다.  \n> 3. 불령선인 단체를 해산하고 소유한 총기를 수색하여 몰수하고 무장을 해제한다. ……  \n> 5. 조선 관리가 지명하는 불령단 수령을 체포하여 조선 관리에게 인도한다.  \n>\n> — 『한국인 단속 방법에 관한 조선 총독부와 펑톈성 사이의 협정』(미쓰야 협정, 1925)  \n\n### 3. 의열 투쟁\n\n- 의열단  \n  - 결성: 김원봉, 윤세주 등 중심 비밀 결사  \n  - 무정부주의 경향, 신채호의 조선 혁명 선언을/를 활동 지침으로 삼아 일제 요인 처단, 식민 통치 기관 파괴 활동 전개  \n  - 단원들이 1920년대 이후 정규 군사 훈련, 독립 지도자 양성(조선 혁명 간부 학교), 조선 민족 혁명당 설립 주도  \n- 한인 애국단  \n  - 결성: 김구이/가 대한민국 임시 정부 침체 극복, 독립운동에 활력을 불어넣기 위해 결성(1931)  \n  - 이봉창 의거(1932. 1.): 도쿄에서 일왕의 마차 행렬에 폭탄 투척  \n  - 윤봉길 의거(1932. 4.): 상하이 훙커우 공원의 일본군 전승 축하식장 폭탄 투척, 다수의 일제 장성과 고관 살상  \n    → 중국 국민당 정부가 대한민국 임시 정부 인정 및 지원하는 계기가 됨.  \n\n> [조선 혁명 선언(일부)]  \n> 조선 안에 강도 일본이 제조한 혁명의 원인이 산같이 쌓여 있다. 언제든지 민중의 폭력적 혁명이 개시되어 ‘독립을 못하면 살지 않으리라’, ‘일본을 몰아내지 못하면 물러서지 않으리라’는 구호를 가지고 계속 전진하면 목적을 관철하고야 말지니, 이는 경찰의 칼이나 군대의 총이나 간교한 정치가의 수단으로도 막지 못하리라.","rounds":[{"id":1,"title":"기본 개념","description":"짧은 답 10 · OX 10","guide":"1–10번은 짧은 답, 11–20번은 OX입니다.","questions":[{"type":"short","q":"1920년 6월 홍범도 등의 연합 부대가 승리한 전투는?","answers":["봉오동 전투"],"explanation":"문서 확인: 봉오동 전투(1920. 6.)"},{"type":"short","q":"1920년 10월 김좌진과 홍범도 등의 부대가 승리한 전투는?","answers":["청산리 대첩","청산리 전투"],"explanation":"문서 확인: 청산리 대첩(1920. 10.)"},{"type":"short","q":"봉오동 전투 이후 일제가 대군을 동원하는 구실로 삼은 사건은?","answers":["훈춘 사건"],"explanation":"문서 확인: 배경: 봉오동 전투 이후 일제가 훈춘 사건을/를 구실로 대군 동원"},{"type":"short","q":"독립군에게 패배한 일제가 간도의 한인을 학살한 사건은?","answers":["간도 참변","경신 참변"],"explanation":"문서 확인: 간도 참변: 봉오동 전투 등 패배 보복, 간도 약한 부대로 김좌진이 이끌었다."},{"type":"short","q":"[간도 참변의 피해자] 빈칸에 들어갈 말을 쓰세요.\n일제는 독립군에 패배한 보복으로 간도의 ______을 학살하였다.","answers":["한인","한국인"],"explanation":"간도 참변의 피해자: 일제는 독립군에 패배한 보복으로 간도의 한인을 학살하였다."},{"type":"short","q":"[대한 독립 군단의 이동] 빈칸에 들어갈 말을 쓰세요.\n일본군을 피해 러시아 ______로 집결하였다.","answers":["자유시","스보보드니"],"explanation":"대한 독립 군단의 이동: 일본군을 피해 러시아 자유시로 집결하였다."},{"type":"short","q":"[자유시 참변의 가해 세력] 빈칸에 들어갈 말을 쓰세요.\n러시아 ______의 무장 해제와 발포로 독립군이 피해를 입었다.","answers":["적군"],"explanation":"자유시 참변의 가해 세력: 러시아 적군의 무장 해제와 발포로 독립군이 피해를 입었다."},{"type":"short","q":"[만주 3부의 구성] 빈칸에 들어갈 말을 쓰세요.\n참의부·정의부·______가 만주 지역에 편성되었다.","answers":["신민부"],"explanation":"만주 3부의 구성: 참의부·정의부·신민부가 만주 지역에 편성되었다."},{"type":"short","q":"[3부의 정부 성격] 빈칸에 들어갈 말을 쓰세요.\n민정과 군정을 함께 갖춘 ______ 자치 정부였다.","answers":["공화주의"],"explanation":"3부의 정부 성격: 민정과 군정을 함께 갖춘 공화주의 자치 정부였다."},{"type":"short","q":"[미쓰야 협정의 상대] 빈칸에 들어갈 말을 쓰세요.\n일제가 독립군 탄압을 위해 만주 지역 ______과 체결하였다.","answers":["군벌"],"explanation":"미쓰야 협정의 상대: 일제가 독립군 탄압을 위해 만주 지역 군벌과 체결하였다."},{"type":"short","q":"[국민부의 개편] 빈칸에 들어갈 말을 쓰세요.\n남만주의 국민부는 ______으로 개편되었다.","answers":["조선 혁명당"],"explanation":"국민부의 개편: 남만주의 국민부는 조선 혁명당으로 개편되었다."},{"type":"short","q":"[혁신 의회의 개편] 빈칸에 들어갈 말을 쓰세요.\n북만주의 혁신 의회는 ______으로 개편되었다.","answers":["한국 독립당"],"explanation":"혁신 의회의 개편: 북만주의 혁신 의회는 한국 독립당으로 개편되었다."},{"type":"short","q":"[의열단의 결성 인물] 빈칸에 들어갈 말을 쓰세요.\n______과 윤세주 등이 중심이 되어 비밀 결사를 만들었다.","answers":["김원봉"],"explanation":"의열단의 결성 인물: 김원봉과 윤세주 등이 중심이 되어 비밀 결사를 만들었다."},{"type":"short","q":"[의열단의 사상 경향] 빈칸에 들어갈 말을 쓰세요.\n국가 권력의 강제를 반대하는 ______ 경향을 보였다.","answers":["무정부주의"],"explanation":"의열단의 사상 경향: 국가 권력의 강제를 반대하는 무정부주의 경향을 보였다."},{"type":"short","q":"[조선 혁명 선언의 작성자] 빈칸에 들어갈 말을 쓰세요.\n______가 작성한 글이 의열단 활동의 지침이 되었다.","answers":["신채호"],"explanation":"조선 혁명 선언의 작성자: 신채호가 작성한 글이 의열단 활동의 지침이 되었다."},{"type":"short","q":"[이봉창 의거의 장소] 빈칸에 들어갈 말을 쓰세요.\n1932년 일본 ______에서 일왕의 마차 행렬에 폭탄을 던졌다.","answers":["도쿄"],"explanation":"이봉창 의거의 장소: 1932년 일본 도쿄에서 일왕의 마차 행렬에 폭탄을 던졌다."},{"type":"short","q":"[윤봉길 의거의 장소] 빈칸에 들어갈 말을 쓰세요.\n1932년 상하이 ______의 일본군 전승 축하식장에서 폭탄을 던졌다.","answers":["훙커우 공원"],"explanation":"윤봉길 의거의 장소: 1932년 상하이 훙커우 공원의 일본군 전승 축하식장에서 폭탄을 던졌다."}]}]},{"id":8,"title":"02 실력 양성 운동","meta":"3 다양한 민족 운동의 전개 | 교과서 34~35쪽 | PDF 16쪽","source":"> 3 다양한 민족 운동의 전개 | 교과서 34~35쪽 | PDF 16쪽  \n> 핵심 개념: 물산 장려 운동, 민립 대학 설립 운동, 문맹 퇴치 운동  \n\n### 1. 실력 양성 운동\n\n- 배경  \n  - 3·1 운동 이후 일부 지식인이 일제로부터 당장 독립이 현실적으로 어렵다 판단  \n- 의미  \n  - 실력을 키워 독립을 준비하자는 운동  \n\n### 2. 실력 양성 운동의 전개\n\n#### 1) 물산 장려 운동\n- 배경  \n  - 회사령 철폐 이후 한국인 회사 설립 활발 → 일본 기업과 경쟁하며 어려움을 겪음.  \n  - 일본에서 수입되는 모든 상품의 관세 면제 시도(면직물, 주류 제외)  \n- 전개  \n  - 민족 산업과 자본을 보호·육성하여 민족 경제 자립 목적으로 물산 장려 운동 전개  \n  - 평양에서 조선 물산 장려회 발족(1920) → 토산품 애용 운동 전개  \n  - 서울에서 물산 장려회가 발족되는 등 전국으로 확산  \n- 영향  \n  - 일정 부분 성과를 거두었으나 생산량이 수요를 따르지 못해 가격 상승  \n  - 사회주의자들이 자본가를 위한 운동이라 비판  \n\n> [한국산 옷감 가격 폭등]  \n> 본토(한국)에서 생산한 물품을 장려하자는 주장이 퍼지면서 수요자가 급증하여 …… 이전에 1원 10전하던 면 1필 21~22척짜리는 이제 1원 50전으로 …… 모시, 삼베 등은 평소보다 1필에 1원 이상 급등하였다 한다.  \n> — 『조선일보』, 1923. 3. 2.  \n\n#### 2) 민립 대학 설립 운동\n- 배경  \n  - 한국인에게 고등 교육의 기회가 주어지지 않음.  \n- 목표  \n  - 한국인의 힘으로 대학을 세워 고등 교육을 실현하자.  \n- 전개  \n  - 민립 대학 기성회 조직: 이상재 중심으로 서울에서 조직  \n  - 전국적으로 큰 호응, 해외에서도 모금 운동 참여  \n- 실패  \n  - 일제의 방해, 잇따른 자연재해로 모금 운동 어려워져 실패  \n  - 경성 제국 대학: 일제가 일본인 교육, 한국인 교육열 무마 위해 설립  \n\n> [조선 민립 대학 기성회 취지서]  \n> 우리의 운명을 어떻게 개척할까? 정치냐? 외교냐? 산업이냐? 물론 이들이 모두 필요하다. 그러나 그 기초와 요건이 되고, 가장 시급하고, 가장 힘 있고 필요한 수단은 교육이다. …… 우리 한국인이 세계 문화 민족의 일원으로 다른 사람과 어깨를 나란히 하고, 우리의 생존을 유지하며, 문화의 창조와 향상을 이루려면 대학 설립 이외의 방법은 없다. …… 우리에게 아직도 대학이 없다. …… 만천하 동포에게 민립 대학의 설립을 제창하니, 자매 형제는 모두 와 성원하라.  \n> — 『동아일보』, 1923. 3. 30.  \n\n#### 3) 문맹 퇴치 운동\n- 배경  \n  - 일제의 차별적 교육 정책으로 문맹자 증가  \n- 전개  \n  - 각지에 야학 설립, 한글 보급 강습회 개최  \n  - 문자 보급 운동: 『조선일보』 주도, ‘아는 것이 힘, 배워야 산다.’ 구호 아래 운동 전개  \n  - 브나로드 운동: 『동아일보』 주도, ‘배우자, 가르치자, 다 함께 브나로드’ 구호 아래 농촌 계몽 운동 전개  \n  - 조선어 학회: 강습회 개최하여 한글 보급에 나섬.  \n- 결과  \n  - 민족주의 색채를 띠자 일제는 1935년부터 전면 금지  \n\n추가 자료) 문자 보급 운동  \n\n> 오늘날 한국인에게 있어 무엇 하나 필요하지 않은 것이 없다. 산업과 건강과 도덕이 다 그러하다. 그러나 그중에서도 가장 필요하고 긴급한 것은 지식 보급이다. 지식이 없이는 산업이나 건강, 도덕이 유지, 발달할 수가 없다. …… 전 인구의 2%밖에 문자를 이해하지 못하고, 학령 아동의 30%밖에 취학할 수 없는 지금 조선의 상태에서 간결하고 쉬운 문자의 보급은 민족의 최대 긴급한 일이다.  \n> — 『조선일보』, 1934. 6. 10.","rounds":[{"id":1,"title":"기본 개념","description":"짧은 답 10 · OX 10","guide":"1–10번은 짧은 답, 11–20번은 OX입니다.","questions":[{"type":"short","q":"민족의 실력을 키워 독립을 준비하자는 운동은?","answers":["실력 양성 운동"],"explanation":"문서 확인: 2. 실력 양성 운동의 전개"},{"type":"short","q":"토산품을 애용하여 민족 산업을 보호하려 한 운동은?","answers":["물산 장려 운동"],"explanation":"문서 확인: 민족 산업과 자본을 보호·육성하여 민족 경제 자립 목적으로 물산 장려 운동 전개"},{"type":"short","q":"1920년 조선 물산 장려회가 발족한 도시는?","answers":["평양"],"explanation":"문서 확인: 평양에서 조선 물산 장려회 발족(1920) → 토산품 애용 운동 전개"},{"type":"short","q":"한국인의 힘으로 대학을 세우려 한 운동은?","answers":["민립 대학 설립 운동"],"explanation":"문서 확인: 2) 민립 대학 설립 운동"},{"type":"short","q":"민립 대학 기성회 조직을 주도한 인물은?","answers":["이상재"],"explanation":"문서 확인: 민립 대학 기성회 조직: 이상재 중심으로 서울에서 조직"},{"type":"short","q":"일제가 일본인 교육과 한국인 교육열 무마를 위해 설립한 대학은?","answers":["경성 제국 대학"],"explanation":"문서 확인: 경성 제국 대학: 일제가 일본인 교육, 한국인 교육열 무마 위해 설립"},{"type":"short","q":"글을 읽고 쓰지 못하는 상태를 없애려는 운동은?","answers":["문맹 퇴치 운동"],"explanation":"문맹 퇴치 운동은 야학과 한글 강습회, 신문사의 문자 보급·농촌 계몽 활동 등으로 전개되었다."},{"type":"short","q":"‘아는 것이 힘, 배워야 산다.’라는 구호로 문자 보급 운동을 주도한 신문은?","answers":["조선일보"],"explanation":"문서 확인: 문자 보급 운동: 『조선일보』 주도, ‘아는 것이 힘, 배워야 산다.’ 구호 아래 운동 전개"},{"type":"short","q":"『동아일보』가 주도한 농촌 계몽 운동은?","answers":["브나로드 운동"],"explanation":"문서 확인: 브나로드 운동: 『동아일보』 주도, ‘배우자, 가르치자, 다 함께 브나로드’ 구호 아래 농촌 계몽 운동 전개"},{"type":"short","q":"한글 강습회를 개최하여 한글 보급에 나선 학회는?","answers":["조선어 학회"],"explanation":"문서 확인: 조선어 학회: 강습회 개최하여 한글 보급에 나섬."},{"type":"ox","q":"실력 양성 운동은 3·1 운동 이후 일부 지식인에 의해 추진되었다.","answers":["O"],"explanation":"당장 독립이 어렵다고 판단한 일부 지식인이 실력을 기르자고 주장하였다."},{"type":"ox","q":"물산 장려 운동은 민족 경제의 자립을 목표로 하였다.","answers":["O"],"explanation":"민족 산업과 자본을 보호하고 육성하려는 운동이었다."},{"type":"ox","q":"물산 장려 운동은 평양에서만 전개되고 다른 지역에는 퍼지지 않았다.","answers":["X"],"explanation":"서울에서도 물산 장려회가 발족하는 등 전국으로 확산되었다."},{"ty 대학의 목적: 일본인 교육과 한국인의 교육열을 무마하려는 목적이 있었다."},{"type":"short","q":"[문맹 증가의 배경] 빈칸에 들어갈 말을 쓰세요.\n일제의 ______으로 문자를 배우지 못한 사람이 늘었다.","answers":["차별적 교육 정책","차별 교육 정책"],"explanation":"문맹 증가의 배경: 일제의 차별적 교육 정책으로 문자를 배우지 못한 사람이 늘었다."},{"type":"short","q":"[문맹 퇴치의 현장] 빈칸에 들어갈 말을 쓰세요.\n각지에 ______을 설립하여 글을 가르쳤다.","answers":["야학"],"explanation":"문맹 퇴치의 현장: 각지에 야학을 설립하여 글을 가르쳤다."},{"type":"short","q":"[문자 보급 운동의 주도 신문] 빈칸에 들어갈 말을 쓰세요.\n‘아는 것이 힘, 배워야 산다.’를 내세운 신문은 『______』이다.","answers":["조선일보"],"explanation":"문자 보급 운동의 주도 신문: ‘아는 것이 힘, 배워야 산다.’를 내세운 신문은 『조선일보』이다."},{"type":"short","q":"[브나로드 운동의 주도 신문] 빈칸에 들어갈 말을 쓰세요.\n‘배우자, 가르치자’를 내세운 신문은 『______』이다.","answers":["동아일보"],"explanation":"브나로드 운동의 주도 신문: ‘배우자, 가르치자’를 내세운 신문은 『동아일보』이다."},{"type":"short","q":"[브나로드 운동의 대상 지역] 빈칸에 들어갈 말을 쓰세요.\n주로 ______에서 계몽 활동을 전개하였다.","answers":["농촌"],"explanation":"브나로드 운동의 대상 지역: 주로 농촌에서 계몽 활동을 전개하였다."},{"type":"short","q":"[한글 보급 강습회] 빈칸에 들어갈 말을 쓰세요.\n______가 강습회를 개최하여 우리 글 보급에 나섰다.","answers":["조선어 학회"],"explanation":"한글 보급 강습회: 조선어 학회가 강습회를 개최하여 우리 글 보급에 나섰다."},{"type":"short","q":"[계몽 운동의 전면 금지] 빈칸에 들어갈 말을 쓰세요.\n민족주의 색채가 강해지자 일제는 ______년부터 전면 금지하였다.","answers":["1935","1935년"],"explanation":"계몽 운동의 전면 금지: 민족주의 색채가 강해지자 일제는 1935년부터 전면 금지하였다."}]}]},{"id":9,"title":"03 민족 유일당 운동","meta":"3 다양한 민족 운동의 전개 | 교과서 36~37쪽 | PDF 18쪽","source":"> 3 다양한 민족 운동의 전개 | 교과서 36~37쪽 | PDF 18쪽  \n> 핵심 개념: 민족주의, 사회주의, 민족 유일당 운동, 신간회  \n\n### 1. 민족 운동의 분화\n\n#### 1) 배경\n① 3·1 운동 이후 청년과 지식인층 중심으로 사회주의 사상 확산  \n\n② 조선 공산당 결성: 1925년 사회주의 계열 조직 통합하여 결성  \n\n#### 2) 분화: 민족 운동이 민족주의와/과 사회주의 계열로 분화\n\n### 2. 민족 유일당 운동\n\n- 배경  \n  - 코민테른이/가 민족주의자와 협력 중시 방침을 채택  \n  - 제1차 국·공 합작  \n- 국외  \n  - 국내외 독립운동 진영에서 민족 유일당 운동 대두 → 만주에서 3부 통합 운동이 일어남.  \n- 국내  \n  - 자치론 제기: 일부 민족주의자가 일제와 타협해 자치권 얻을 것 주장 → 일제가 지원  \n  - 비타협적 민족주의자: 자치론자 비판, 사회주의 세력과 연대 움직임  \n  - 사회주의자: 치안 유지법으로 탄압 → 비타협적 민족주의자와 연대해 합법적 활동 공간 마련 움직임  \n  - 조선 민흥회 결성(1926. 7.): 비타협적 민족주의 세력, 일부 사회주의 세력이 연합하여 결성  \n  - 정우회 선언 발표: 사회주의 계열인 정우회가 비타협적 민족주의 세력과의 제휴 주장  \n\n> [정우회 선언]  \n> 우리는 우선 사상 단체의 통일부터 주장한다. …… (민족주의적 세력이) 우리와 과정적 동맹자가 될 수 있음을 충분히 인정한다. 그것이 타락한 형태로 나타나지 않는다면 대중의 더 나은 이익을 위해서도 적극적으로 제휴하여 이전의 소극적인 태도를 버리고 분연히 싸워야 할 것이다.  \n> — 『조선일보』, 1926. 11. 17.  \n\n### 3. 신간회의 결성과 해소\n\n- 성립  \n  - 신간회 결성(1927): 민족주의 세력과 사회주의 세력이 연합한 최대 규모의 합법적인 민족 협동 전선 단체  \n  - 회장 이상재, 부회장 홍명희 선출 및 강령 채택  \n- 활동  \n  - 서울에 본부를 두고, 전국 각지와 만주, 일본 등에도 지회를 둠.  \n  - 순회강연 개최  \n  - 다양한 사회 운동 지원: 노동 운동, 농민 운동 등  \n  - 광주 학생 항일 운동 진상 조사단 파견, 일제의 학생 운동 탄압 항의  \n  - 민중 대회 개최 시도: 광주 학생 항일 운동을 전국적으로 확산하려는 목적 → 일제에 발각되며 신간회 지도부 대부분 체포  \n- 해소  \n  - 일제의 심한 탄압  \n  - 코민테른 노선 변경, 중국 국·공 합작 결렬 등 국제 정세 변화  \n  - 민중 대회 이후 새로운 지도부가 일제에 타협적인 모습을 보임.  \n  - 민족주의 세력과 사회주의 세력 노선 갈등 심화로 해소 결정(1931)  \n\n> [신간회 강령]  \n> 1. 우리는 정치적·경제적 각성을 촉진함.  \n> 2. 우리는 단결을 공고히 함.  \n> 3. 우리는 기회주의를 일체 부인함.  \n> — 『동아일보』, 1927. 1. 20.  \n\n> [국제 정세의 변화]  \n> 일본 제국주의는 \\*개량주의적 부르주아에게 자치를 약속하여 그들을 매수하고, 그들의 도움을 얻어 새로운 혁명적 방파제를 쌓으려 하고 있다. …… 그들(개량주의적 부르주아)은 일본 제국주의와 협력을 구하고 반소비에트를 부추기고 있다. 신간회 또한 똑같은 민족 개량주의 단체이다.  \n> — 「9월 테제」(1930)  \n> \\*개량주의: 체제를 유지한 채 점진적 개선을 주장하는 것","rounds":[{"id":1,"title":"기본 개념","description":"짧은 답 10 · OX 10","guide":"1–10번은 짧은 답, 11–20번은 OX입니다.","questions":[{"type":"short","q":"1925년 사회주의 계열이 통합하여 결성한 정당은?","answers":["조선 공산당"],"explanation":"문서 확인: 조선 공산당 결성: 1925년 사회주의 계열 조직 통합하여 결성"},{"type":"short","q":"민족주의와 사회주의 세력이 통일된 조직을 만들려 한 운동은?","answers":["민족 유일당 운동"],"explanation":"문서 확인: 국내외 독립운동 진영에서 민족 유일당 운동 대두 → 만주에서 3부 통합 운동이 일어남."},{"type":"short","q":"민족주의자와의 협력을 중시하는 방침을 채택한 국제 조직은?","answers":["코민테른"],"explanation":"문서 확인: 코민테른이/가 민족주의자와 협력 중시 방침을 채택"},{"type":"short","q":"일제와 타협하여 자치권을 얻자고 한 주장은?","answers":["자치론"],"explanation":"문서 확인: 자치론 제기: 일부 민족주의자가 일제와 타협해 자치권 얻을 것 주장 → 일제가 지원"},{"type":"short","q":"1926년 7월 비타협적 민족주의자와 일부 사회주의자가 결성한 단체는?","answers":["조선 민흥회"],"explanation":"문서 확인: 조선 민흥회 결성(1926. 7.): 비타협적 민족주의 세력, 일부 사회주의 세력이 연합하여 결성"},{"type":"short","q":"사회주의 세력이 비타협적 민족주의 세력과의 제휴를 주장한 선언은?","answers":["정우회 선언"],"explanation":"문서 확인  개념: 6·10 만세 운동, 광주 학생 항일 운동  \n\n### 1. 6·10 만세 운동\n\n#### 1) 배경\n① 사회주의 사상이 학생과 지식인 사이에 확산  \n\n② 3·1 운동에서 만세 시위를 주도하였던 학생들은 동맹 휴학 등 일제에 대한 저항 지속  \n\n③ 대한 제국의 마지막 황제였던 순종 서거  \n\n④ 사회주의 단체, 천도교, 학생들이 순종 인산일 계기로 대규모 만세 운동 계획  \n→ 사전에 발각되어 수많은 애국지사 검거당함.  \n\n#### 2) 전개\n① 일제의 감시 속에서도 학생들의 주도로 1926년 6월 10일 만세 운동 전개  \n\n② 학생들은 격문을 뿌리며 만세 시위, 순종의 장례 행렬에 참가한 시민들 참가  \n\n③ 여러 지역의 학생들도 동맹 휴학으로 시위에 호응  \n\n④ 일제의 탄압으로 많은 부상자 발생, 서울에서만 200명 이상 검거  \n\n#### 3) 영향\n① 학생 항일 운동이 활성화되는 계기  \n\n② 통일된 독립운동 필요성 제기 → 민족주의 계열 + 사회주의 계열  \n\n③ 민족 유일당 운동 추진에 영향  \n\n> [6·10 만세 운동 1회 공판]  \n> 재판장: 피고는 6월 10일 국장 지나갈 때 격문을 뿌리며 ○○○○ 만세를 불렀는가?  \n> 피고: 그렇소.  \n> 재판장: 그것은 무슨 목적으로 불렀는가?  \n> 피고: 그것은 세 살 난 아이라도 다 알 일이니 구태여 물을 필요도 없는 줄 아오.  \n> \\*○○○○: 당시 검열된 신문에서 빈칸으로 처리되었다.  \n\n### 2. 광주 학생 항일 운동\n\n#### 1) 배경\n① 학생 운동 활성화: 6·10 만세 운동 계기  \n- 독서회 등 각종 비밀 결사 조직  \n- 토론, 동맹 휴학 등 다양한 활동 전개  \n\n② 초기에는 학내 문제 개선 요구 → 식민지 교육 반대 운동으로 발전  \n\n#### 2) 전개\n① 한·일 학생 충돌  \n- 일본인 학생의 한국인 여학생 희롱 → 일제 경찰의 차별로 한국인 학생 불만 고조  \n- 일왕 생일 기념식(음력 개천절이자 일요일)에 등교하여 신사 참배 강요  \n  → 한·일 학생들 간에 충돌 발생 → 격문 뿌리며 봉기  \n\n② 광주에서 시작 → 목포, 나주로 확산 → 12월에는 서울 지역까지 확산  \n\n③ ‘식민지 교육 철폐’, ‘일본 제국주의 타도’, ‘민족 해방’ 주장  \n\n④ 1930년 3월까지 전국에서 시위와 동맹 휴학 지속  \n\n⑤ 의의  \n- 전국 320개 교, 수만 명의 학생 참여, 시민과 노동자도 참여  \n- 3·1 운동 이후 최대 규모의 민족 운동, 이후 학생 운동에도 큰 영향  \n\n> [광주 학생 항일 운동 격문]  \n> 장엄한 학생 대중이여! 최후까지 우리들의 슬로건을 지지하라.  \n> 그리하여 궐기하자, 싸우자. 굳세게 싸워라.  \n> - 검거자를 즉시 우리 손으로 탈환하자.  \n> - 한국인 본위의 교육 제도를 확립하라.  \n> - 사회 과학 연구의 자유를 획득하라.  \n> - 교내에 경찰의 침입을 절대 반대한다.  \n> - 식민지 노예 교육 제도를 철폐하라.  \n> - 전국 학생 대표자 회의를 개최하라.","rounds":[{"id":1,"title":"기본 개념","description":"짧은 답 10 · OX 10","guide":"1–10번은 짧은 답, 11–20번은 OX입니다.","questions":[{"type":"short","q":"6·10 만세 운동의 계기가 된 장례식의 주인공은?","answers":["순종"],"explanation":"문서 확인: 대한 제국의 마지막 황제였던 순종 서거"},{"type":"short","q":"6·10 만세 운동이 일어난 해는?","answers":["1926","1926년"],"explanation":"문서 확인: 일제의 감시 속에서도 학생들의 주도로 1926년 6월 10일 만세 운동 전개"},{"type":"short","q":"계획 발각 후에도 6·10 만세 운동을 주도한 집단은?","answers":["학생"," 광주에서 시작된 확산: 목포와 나주를 거쳐 12월에는 서울까지 퍼졌다."},{"type":"short","q":"[운동이 지속된 시기] 빈칸에 들어갈 말을 쓰세요.\n전국의 시위와 동맹 휴학이 ______년 3월까지 이어졌다.","answers":["1930","1930년"],"explanation":"운동이 지속된 시기: 전국의 시위와 동맹 휴학이 1930년 3월까지 이어졌다."},{"type":"short","q":"[전국적인 참여 학교] 빈칸에 들어갈 말을 쓰세요.\n광주 학생 항일 운동에는 전국 ______개 학교의 학생들이 참여하였다.","answers":["320","320개"],"explanation":"전국적인 참여 학교: 광주 학생 항일 운동에는 전국 320개 학교의 학생들이 참여하였다."},{"type":"short","q":"[광주 학생 격문의 교육 요구] 빈칸에 들어갈 말을 쓰세요.\n______ 본위의 교육 제도를 확립하라고 요구하였다.","answers":["한국인"],"explanation":"광주 학생 격문의 교육 요구: 한국인 본위의 교육 제도를 확립하라고 요구하였다."},{"type":"short","q":"[광주 학생 격문의 학교 자율 요구] 빈칸에 들어갈 말을 쓰세요.\n교내에 ______이 침입하는 것을 절대 반대하였다.","answers":["경찰"],"explanation":"광주 학생 격문의 학교 자율 요구: 교내에 경찰이 침입하는 것을 절대 반대하였다."}]}]},{"id":11,"title":"01 도시와 농촌의 변화","meta":"4 사회·문화의 변화와 대중 운동 | 교과서 42~43쪽 | PDF 22쪽","source":"> 4 사회·문화의 변화와 대중 운동 | 교과서 42~43쪽 | PDF 22쪽  \n> 핵심 개념: 철도 교통망, 농촌 진흥 운동  \n\n### 1. 교통과 도시의 발달\n\n- 철도  \n  - 한반도 × 자로 관통하는 철도망 완성  \n  - 철도 교통 중심지에 새로운 도시 형성  \n  - 공간 인식 변화, 근대적 시간관념 정착  \n  - 자원 수탈과 만주, 중국 침략을/를 위한 군사적 수단  \n- 도시화  \n  - 한국인과 일본인 거주지 분리  \n  - 일본인 거주지 중심 근대 문물 유입, 도시 변두리 빈민은 토막집 거주  \n\n### 2. 농촌 사회의 변화\n\n#### 1) 지주와 농민\n- 지주  \n  - 일부 한국인 지주와 부농이 일제 정책에 호응  \n  - 일제의 이민 정책으로 이주해 온 일본인, 일본 기업이 지주가 됨.  \n- 농민  \n  - 높은 소작료, 각종 비용과 세금 부담, 고리대 등으로 피해  \n\n#### 2) 농촌의 변화\n- 배경  \n  - 식민지화와 함께 자본주의 상품 경제 농촌 침투  \n- 전개  \n  - 철도, 도로, 해운 발달: 한국 농촌이 일본 자본주의에 예속되는 수단  \n  - 농민 → 새로운 상품에 노출, 새로운 물건을 사기 위해 헐값에 생산물 판매  \n- 영향  \n  - 농민의 몰락 → 소작농, 화전민, 도시 또는 해외 이주  \n\n#### 3) 농촌 진흥 운동(1932)\n- 배경  \n  - 농촌 경제 피폐, 소작 쟁의 확산  \n- 전개  \n  - 농촌 사회 통제 및 식민지 지배 체제 안정 목적 → 근면, 절약 강조, 농민 생활 태도 개선에 치중  \n- 한계  \n  - 문제 해결을 위한 구조적 개혁 외면 → 성과 거두지 못함.  \n\n도시의 모습  \n\n> [남촌은 광명, 북촌은 암흑]  \n> 경성부 내 길가 조명을 하기 위하여 매년 약 7천 원의 전등 요금을 지불한다. 그 가로등은 대개 혼마치 …… 가로등이 없어도 밝은 곳에 많이 달고, 북촌 어두운 곳에는 짓지 않는다.  \n> — 『조선일보』, 1931. 3. 14.","rounds":[{"id":1,"title":"기본 개념","description":"짧은 답 10 · OX 10","guide":"1–10번은 짧은 답, 11–20번은 OX입니다.","questions":[{"type":"short","q":"일제 강점기에 한반도를 관통한 철도망의 모양은?","answers":["X자","×자","X","×","엑스자"],"explanation":"문서 확인: 한반도 × 자로 관통하는 철도망 완성"},{"type":"short","q":"철도 운행 시간표 등이 정착시킨 새로운 시간 인식은?","answers":["근대적 시간관념"],"explanation":"문서 확인: 공간 인식 변화, 근대적 시간관념 정착"},{"type":"short","q":"도시 변두리 빈민이 살던 집의 형태는?","answers":["토막집"],"explanation":"문서 확인: 일본인 거주지 중심 근대 문물 유입, 도시 변두리 빈민은 토막집 거주"},{"type":"short","q":"농민이 남의 땅을 경작한 대가로 지주에게 내던 것은?","answers":["소작료"],"explanation":"문서 확인: 높은 소작료, 각종 비용과 세금 부담, 고리대 등으로 피해"},{"type":"short","q":"농민에게 부담이 된 높은 이자의 빚을 가리키는 말은?","answers":["고리대"],"explanation":"문서 확인: 높은 소작료, 각종 비용과 세금 부담, 고리대 등으로 피해"},{"type":"short","q":"농촌에 침투한 경제 형태는 ‘자본주의 ( ) 경제’이다. 빈칸은?","answers":["상품"],"explanation":"문서 확인: 식민지화와 함께 자본주의 상품 경제 농촌 침투"},{"type":"short","q":"교통망 발달은 한국 농촌이 어느 나라의 자본주의에 예속되는 수단이 되었는가?","answers":["일본"],"explanation":"문서 확인: 한국인과 일본인 거주지 분리"},{"type":"short","q":"농촌 사회 통제와 식민 지배 안정을 위해 1932년 추진한 운동은?","answers":["농촌 진흥 운동"],"explanation":"문서 확인: 3) 농촌 진흥 운동(1932)"},{"type":"short","q":"농촌 진흥 운동이 시작된 해는?","answers":["1932","1932년"],"explanation":"문서 확인: 3) 농촌 진흥 운동(1932)"},{"type":"short","q":"농촌 진흥 운동이 근면과 함께 강조한 생활 태도는?","answers":["절약"],"explanation":"문서 확인: 농촌 사회 통제 및 식민지 지배 체제 안정 목적 → 근면, 절약 강조, 농민 생활 태도 개선에 치중"},{"type":"ox","q":"철도 교통 중심지에는 새로운 도시가 형성되었다.","answers":["O"],"explanation":"철도망의 확장은 도시의 형성과 성장에 영향을 주었다."},{"type":"ox","q":"철도는 자원 수탈과 중국 침략을 위한 군사적 수단이기도 하였다.","answers":["O"],"explanation":"일제는 철도를 식민지 수탈과 대륙 침략에 활용하였다."},{"type":"ox","q":"도시에서 한국인과 일본인의 거주지는 분리되는 모습을 보였다.","answers":["O"],"explanation":"민족별 거주지 분리와 생활환경의 차이가 나타났다."},{"type":"ox","q":"근대 문물은 주로 일본인 거주지를 중심으로 유입되었다.","answers":["O"],"explanation":"도시의 근대 시설과 편의는 일본인 거주지에 집중되었다."},{"type":"ox","q":"일제의 이민 정책으로 온 일본인과 일본 기업도 지주가 되었다.","answers":["O"],"explanation":"일본인 이주민과 기업이 토지를 소유하며 지주층을 이루었다."},{"type":"ox","q":"모든 한국인 지주와 부농은 일제의 농업 정책에 반대하였다.","answers":["X"],"explanation":"일부 한국인 지주와 부농은 일제 정책에 호응하였다."},{"type":"ox","q":"농민은 새 상품을 사기 위해 생산물을 헐값에 팔기도 하였다.","answers":[ ":"몰락 농민의 이동: 소작농·화전민이 되거나 도시와 해외로 이주하였다."},{"type":"short","q":"[농촌 진흥 운동의 배경] 빈칸에 들어갈 말을 쓰세요.\n농촌 경제가 피폐해지고 ______가 확산되었다.","answers":["소작 쟁의"],"explanation":"농촌 진흥 운동의 배경: 농촌 경제가 피폐해지고 소작 쟁의가 확산되었다."},{"type":"short","q":"[농촌 진흥 운동의 통치 목적] 빈칸에 들어갈 말을 쓰세요.\n농촌 사회를 통제하고 식민지 ______를 안정시키려 하였다.","answers":["지배 체제"],"explanation":"농촌 진흥 운동의 통치 목적: 농촌 사회를 통제하고 식민지 지배 체제를 안정시키려 하였다."},{"type":"short","q":"[농촌 진흥 운동의 한계] 빈칸에 들어갈 말을 쓰세요.\n생활 태도 개선에 치중하고 문제의 ______을 외면하였다.","answers":["구조적 개혁"],"explanation":"농촌 진흥 운동의 한계: 생활 태도 개선에 치중하고 문제의 구조적 개혁을 외면하였다."}]}]},{"id":12,"title":"02 농민 운동과 노동 운동","meta":"4 사회·문화의 변화와 대중 운동 | 교과서 44~45쪽 | PDF 24쪽","source":"> 4 사회·문화의 변화와 대중 운동 | 교과서 44~45쪽 | PDF 24쪽  \n> 핵심 개념: 암태도 소작 쟁의, 조선 농민 총동맹, 원산 총파업  \n\n### 1. 농민 운동\n\n- 배경  \n  - 토지 조사 사업와/과 산미 증식 계획으로 농민 몰락 → 소작농 증가  \n  - 소작농 입지 약화: 고율 소작료, 지주가 부담할 비용 대신 부담  \n  - 사회주의 유입: 농민 옹호 단체 결성되어 농민 운동 지원  \n- 1920년대  \n  - 생존권을 요구하는 소작 쟁의가 주를 이룸.  \n  - 암태도 소작 쟁의(1923): 지주와 일본 경찰의 탄압에도 소작료 인하 성공  \n- 1920년대 중반 이후  \n  - 소작인 조합이 농민 조합으로 개편  \n  - 조선 농민 총동맹(1927) 결성  \n- 1930년대  \n  - 사회주의와 연계하여 비합법 조직인 혁명적 농민 조합 중심으로 농민 운동 전개  \n  - 중·일 전쟁 이후 일제가 강제로 소작 쟁의 봉쇄  \n\n### 2. 노동 운동\n\n- 배경  \n  - 식민지 공업화로 노동자 증가  \n  - 열악한 노동 환경, 장시간 노동, 저임금, 한국인과 일본인 노동자 차별 대우  \n  - 사회주의 확산: 노동 단체 결성  \n- 1920년대  \n  - 부산 부두 노동자 총파업(1921), 서울 고무 공장 여성 노동자 파업(1923)  \n  - 원산 총파업(1929): 1928년 석유회사에서 일본인 감독관이 한국인 노동자를 구타하면서 시작, 국외 노동 단체의 격려와 지지 → 일제의 강경 진압으로 실패  \n- 1930년대  \n  - 사회주의와 연계하여 비합법 조직인 혁명적 노동조합의 형태로 노동 운동 전개 → 반제국주의 항일 운동 성격  \n  - 중·일 전쟁 이후 일제의 탄압 본격화로 점차 약화  \n\n> [일제의 원산 총파업 탄압]  \n> 24일 오전에는 함흥 보병대에서 약 300명의 병사가 원산에 도착하여 시내 각지에서 시위 행진을 하였다. 원산 경찰서는 파업 간부 7, 8명을 검속하고 엄중 취조하는 한편, 경우에 따라서는 대검속을 하려고 경계 중에 있다.  \n> — 『조선일보』, 1929. 1. 25.  \n\n추가 자료) 암태도 소작 쟁의의 발단  \n\n> 암태도 사건은 사회적 중대 사건이다. 이를 일개 섬사람의 이해 문제라 하여 쉽게 볼 수 없고, 일개 지주의 악행 문제라 하여 가볍게 볼 수 없다. 우리는 이 사건의 중대함을 말하고자 하며 먼저 사건의 경과를 대략적으로 적으려 한다.  \n>\n> 목포 무안면 암태도 인민이 과중한 소작료를 경감하라고 각 지주에게 교섭한 일이 있었다. 그 결과 다른 지주들은 모두 승낙하였으나 문재철이란 자는 홀로 동의하지 아니하였다. 섬 주민들이 이를 분하게 여겨 섬에 건립했던 문재철 아버지의 송덕비를 뽑아버리기로 결의하고 비가 있는 데로 몰려갔다. 이 일이 있을 것을 미리 전해 들은 문재철은 돈으로 사람을 사서 도중에 매복하였다가 많은 사람을 구타하여 상해를 입힌 것이 이 사건의 발단이 되니 이것은 지난 4월의 일이다. 그때 가해한 문재철 측 일부 인원과 피해를 입은 사람 13인이 구금되었는데 그 후에 가해자 측에서는 방면된 자가 있으나 피해자 측 13인은 소요를 일으킨 죄가 있다 하여 경찰서에서 재판소로 넘기게 되었다. 이에 지금부터 20여 일 전에 암태도 인민 600여 인이 13인을 석방하라고 광주지방법원 목포지청에 호소하였다가 방면이나 보석을 시키겠다는 이야기를 듣고 해산하였다.  \n> — 『동아일보』, 1924. 7. 13.","rounds":[{"id":1,"title":"기본 개념","description":"짧은 답 10 · OX 10","guide":"1–10번은 짧은 답, 11–20번은 OX입니다.","questions":[{"type":"short","q":"산미 증식 계획과 함께 농민 몰락의 배경이 된 토지 관련 사업은?","answers":["토지 조사 사업"],"explanation":"문서 확인: 토지 조사 사업와/과 산미 증식 계획으로 농민 몰락 → 소작농 증가"},{"type":"short","q":"1923년 시작되어 소작료 인하에 성공한 대표적 농민 운동은?","answers":["암태도 소작 쟁의"],"explanation":"문서 확인: 암태도 소작 쟁의(1923): 지주와 일본 경찰의 탄압에도 소작료 인하 성공"},{"type":"short","q":"1920년대 농민들이 소작료 인하 등을 요구하며 벌인 쟁의는?","answers":["소작 쟁의"],"explanation":"문서 확인: 생존권을 요구하는 소작 쟁의가 주를 이룸."},{"type":"short","q":"1920년대 중반 이후 소작인 조합이 개편된 조직은?","answers":["농민 조합"],"explanation":"문서 확인: 소작인 조합이 농민 조합으로 개편"},{"type":"short","q":"1927년 결성된 전국적 농민 단체는?","answers":["조선 농민 총동맹"],"explanation":"문서 확인: 조선 농민 총동맹(1927) 결성"},{"type":"short","q":"1930년대 사회주의와 연계된 비합법 농민 조직은?","answers":["혁명적 농민 조합"],"explanation":"문서 확인: 사회주의와 연계하여 비합법 조직인 혁명적 농민 조합 중심으로 농민 운동 전개"},{"type":"short","q":"1929년에 전개된 대표적 노동자 총파업은?","answers":["원산 총파업"],"explanation":"문서 확인: 원산 총파업(1929): 1928년 석유회사에서 일본인 감독관이 한국인 노동자를 구타하면서 시작, 국외 노동 단체의 격려와 지지 → 일제의 강경 진압으로 실패"},{"type":"short","q":"1921년 부두 노동자 총파업이 일어난 도시는?","answers":["부산"],"explanation":"문서 확인: 부산 부두 노동자 총파업(1921), 서울 고무 공장 여성 노동자 파업(1923)"},{"type":"short","q":"1923년 서울에서 여성 노동자들이 파업한 공장의 생산품은?","answers":["고무"],"explanation":"문서 확인: 부산 부두 노동자 총파업(1921), 서울 고무 공장 여성 노동자 파업(1923)"},{"type":"short","q":"1930년대 비합법 노동 조직은 ‘( ) 노동조합’의 형태였다. 빈칸은?","answers":["혁명적"],"explanation":"문서 확인: 사회주의와 연계하여 비합법 조직인 혁명적 농민 조합 중심으로 농민 운동 전개"},{"type":"ox","q":"1920년대 농민 운동에서는 생존권을 요구하는 소작 쟁의가 많았다.","answers":["O"],"explanation":" 후 일제가 소작 쟁의를 강제로 봉쇄하였다.","answers":["중·일 전쟁","중일 전쟁"],"explanation":"전시 소작 쟁의 통제: 중·일 전쟁 이후 일제가 소작 쟁의를 강제로 봉쇄하였다."},{"type":"short","q":"[노동자 수 증가의 배경] 빈칸에 들어갈 말을 쓰세요.\n______로 노동자 수가 증가하였다.","answers":["식민지 공업화","공업화"],"explanation":"노동자 수 증가의 배경: 식민지 공업화로 노동자 수가 증가하였다."},{"type":"short","q":"[노동자의 임금 조건] 빈칸에 들어갈 말을 쓰세요.\n장시간 노동과 ______ 등 열악한 조건에 시달렸다.","answers":["저임금"],"explanation":"노동자의 임금 조건: 장시간 노동과 저임금 등 열악한 조건에 시달렸다."},{"type":"short","q":"[노동 현장의 민족 차별] 빈칸에 들어갈 말을 쓰세요.\n한국인과 ______ 노동자 사이에 차별 대우가 있었다.","answers":["일본인"],"explanation":"노동 현장의 민족 차별: 한국인과 일본인 노동자 사이에 차별 대우가 있었다."},{"type":"short","q":"[부산 부두 노동자의 파업] 빈칸에 들어갈 말을 쓰세요.\n부두 노동자 총파업이 ______년에 일어났다.","answers":["1921","1921년"],"explanation":"부산 부두 노동자의 파업: 부두 노동자 총파업이 1921년에 일어났다."},{"type":"short","q":"[서울 여성 노동자의 파업] 빈칸에 들어갈 말을 쓰세요.\n1923년 서울 ______ 공장의 여성 노동자들이 파업하였다.","answers":["고무"],"explanation":"서울 여성 노동자의 파업: 1923년 서울 고무 공장의 여성 노동자들이 파업하였다."},{"type":"short","q":"[원산 총파업의 발단 업종] 빈칸에 들어갈 말을 쓰세요.\n일본인 감독관의 구타 사건이 ______에서 발생하였다.","answers":["석유회사","석유 회사"],"explanation":"원산 총파업의 발단 업종: 일본인 감독관의 구타 사건이 석유회사에서 발생하였다."},{"type":"short","q":"[원산 총파업의 결말] 빈칸에 들어갈 말을 쓰세요.\n국외의 지지를 받았으나 일제의 강경 진압으로 ______하였다.","answers":["실패"],"explanation":"원산 총파업의 결말: 국외의 지지를 받았으나 일제의 강경 진압으로 실패하였다."},{"type":"short","q":"[1930년대 노동 운동의 성격] 빈칸에 들어갈 말을 쓰세요.\n혁명적 노동조합의 활동은 ______ 항일 운동 성격을 띠었다.","answers":["반제국주의"],"explanation":"1930년대 노동 운동의 성격: 혁명적 노동조합의 활동은 반제국주의 항일 운동 성격을 띠었다."}]}]},{"id":13,"title":"03 대중 운동과 민족 문화 수호 운동","meta":"4 사회·문화의 변화와 대중 운동 | 교과서 46~49쪽 | PDF 26쪽","source":"> 4 사회·문화의 변화와 대중 운동 | 교과서 46~49쪽 | PDF 26쪽  \n> 핵심 개념: 근우회, 천도교 소년회, 조선 형평사, 조선어 학회 사건, 민족주의 사학, 사회경제 사학  \n\n### 1. 여성 운동\n\n- 배경  \n  - 여성은 일제 강점기 가부장적 사회 분위기에서 종속적 존재로 여겨짐.  \n  - 상속, 취업 등에서 차별, 남성 노동자보다 낮은 임금을 받음.  \n- 활동  \n  - 여성의 사회적 지위 향상, 여성 해방 목표  \n  - 차미리사 등 조선 여자 교육회 조직, 부인 야학 강습소(근화 여학교) 설립  \n  - 조선 여자 기독교 청년회: 여성 교육, 여성 차별 악습 타파, 생활 개선 활동  \n  - 조선 여성 동우회: 사회주의 계열 단체. 여성 해방을 위한 단결 주장  \n- 근우회  \n  - 창립: 신간회 결성에 자극받아 창립(1927. 5.)  \n  - 목표: 조선 여자의 공고한 단결과 지위 향상 목적  \n  - 의의: 민족주의 및 사회주의 계열 여성 운동을 모두 망라한 일제 강점기 최대의 여성 단체  \n  - 활동: 『근우』, 순회강연으로 여성 의식 향상 노력, 다양한 사회 운동 지원  \n\n> [근화 여학교 교훈]  \n> 살되, 네 생명을 살아라. 생각하되, 네 생각으로 하여라. 알되, 네가 깨달아 알아라.  \n> — 『조선일보』, 1926. 1. 21.  \n\n### 2. 소년 운동\n\n#### 1) 배경\n① 일제 강점기 어린이 대부분 교육을 받지 못함.  \n② 공장에서 낮은 임금을 받고 일하며 열악한 대우를 받음.  \n\n#### 2) 천도교 소년회\n① 방정환 등이 조직(1921), 어린이 인권 향상 목적  \n② ‘어린이’ 용어: 방정환이 어린아이를 인격적으로 대우한다는 뜻으로 만듦.  \n③ 1922년 5월 1일 어린이날(으)로 제정, 기념식 거행, 잡지 『어린이』 발간  \n\n### 3. 형평 운동\n\n#### 1) 배경\n① 갑오개혁으로 법적으로는 신분 차별이 사라졌지만, 백정에 대한 차별은 지속  \n② 호적에 직업을 도한(백정)으로 기록하거나, 붉은 점을 찍어 구분  \n③ 백정 자녀의 학교 입학 거부 혹은 입학 후에도 차별을 받음.  \n\n#### 2) 조선 형평사\n① 1923년 경남 진주에서 조직, 형평 운동 전개  \n② 전국으로 조직 확대, 노동 운동, 농민 운동에 협력  \n③ 1920년대 말부터 내부 이념 갈등으로 조직 약화, 일제 탄압 강화  \n④ 1930년대 중반 이후에는 친목 도모 및 경제적 이익 추구 중심  \n\n> [조선 형평사 창립 취지문]  \n> 공평은 사회의 근본이고, 애정은 인간의 본성이다. 계급을 타파하고 모욕적 칭호를 폐지하며 교육을 권장하여 우리도 참다운 인간이 되고자 하는 것이 본사(조선 형평사)의 주된 뜻이다. …… 직업의 구별이 있다고 하면 금수의 생명을 빼앗는 자 우리만이 아닌 것이다.  \n> — 『조선일보』, 1923. 4. 30.  \n\n### 4. 우리말과 역사 연구\n\n- 국어 연구  \n  - 조선어 연구회(1921): ‘가갸날’ 제정, 『한글』 잡지  \n  - 조선어 학회(1931): 한글 맞춤법 통일안, 『조선말 큰사전』 편찬 시도  \n  - 조선어 학회 사건(1942): 일제가 조선어 학회를 독립운동 단체로 간주하여 회원들 체포·투옥하고 강제로 해산  \n- 역사 연구  \n  - 민족주의 사학  \n    - 신채호: 고대사 연구 중심, 민족 중심 자주적 역사관 강조  \n    - 박은식: 근대사 연구 중심, 민족혼 강조  \n  - 사회경제 사학: 백남운 등, 유물 사관 입장에서 한국사 연구, 한국사의 세계사적 보편성 강조, 식민 사관 중 정체성론 반박  \n  - 실증 사학: 이병도, 손진태 등, 진단 학회 조직, 『진단 학보』 발행","rounds":[{"id":1,"title":"기본 개념","description":"짧은 답 10 · OX 10","guide":"1–10번은 짧은 답, 11–20번은 OX입니다.","questions":[{"type":"short","q":"차미리사 등이 조직하여 여성 교육을 추진한 단체는?","answers":["조선 여자 교육회"],"explanation":"문서 확인: 차미리사 등 조선 여자 교육회 조직, 부인 야학 강습소(근화 여학교) 설립"},{"type":"short","q":"1927년 민족주의·사회주의 계열 여성이 함께 결성한 단체는?","answers":["근우회"],"explanation":"근우회는 1927년 민족주의와 사회주의 계열을 망라하여 결성된 여성 단체이다."},{"type":"short","q":"근우회 결성에 자극을 준 민족 협동 전선 단체는?","answers":["신간회"],"explanation":"문서 확인: 창립: 신간회 결성에 자극받아 창립(1927. 5.)"},{"type":"short","q":"천도교 소년회를 조직하고 어 hort","q":"[실증 사학의 조직] 빈칸에 들어갈 말을 쓰세요.\n이병도·손진태 등은 ______를 조직하고 학보를 발행하였다.","answers":["진단 학회"],"explanation":"실증 사학의 조직: 이병도·손진태 등은 진단 학회를 조직하고 학보를 발행하였다."}]}]},{"id":14,"title":"01 대공황과 제2차 세계 대전","meta":"5 일제 침략 전쟁과 광복을 위한 노력 | 교과서 52~53쪽 | PDF 28쪽","source":"> 5 일제 침략 전쟁과 광복을 위한 노력 | 교과서 52~53쪽 | PDF 28쪽  \n> 핵심 개념: 대공황, 전체주의, 제2차 세계 대전  \n\n### 1. 대공황의 발생\n\n#### 1) 대공황\n- 발생  \n  - 1929년 미국 증권 거래소 주식 가격 폭락  \n- 영향  \n  - 기업 파산, 실업자 증가, 세계 무역 규모 감소  \n\n#### 2) 극복 노력\n- 미국  \n  - 뉴딜 정책 → 사회 간접 자본 확충, 노동자 권익 보장  \n- 영국·프랑스  \n  - 파운드 블록, 영연방 경제 유대 강화  \n- 프랑스  \n  - 식민지와 블록 경제 형성  \n\n#### 3) 전체주의의 확산\n① 배경  \n- 이탈리아, 독일, 일본에서의 경제 위기  \n- 후발 자본주의 국가는 국내 시장 협소, 식민지 적어 제1차 세계 대전 후 경제 위기를 겪음.  \n\n② 전체주의의 확산  \n- 전체주의  \n  - 국가·민족을 앞세워 개인의 자유·권리를 억압하는 사상  \n- 확산  \n  - 이탈리아: 무솔리니, 파시스트당  \n  - 독일: 히틀러, 나치당  \n  - 일본: 군국주의 가속화  \n- 영향  \n  - 침략 전쟁으로 국민의 불만을 잠재우고, 해외 시장 확보하여 경제 위기 극복하려는 의도  \n  - 독일, 이탈리아, 일본이 방공 협정 맺고 대외 침략 본격화  \n\n### 2. 일제의 침략 전쟁과 제2차 세계 대전\n\n#### 1) 유럽 전선: 독일이 폴란드 침공(1939) → 프랑스 점령 → 소련 침공 → 연합국의 공격으로 이탈리아, 독일 항복\n\n#### 2) 아시아·태평양 전쟁\n- 배경  \n  - 일본의 침략 전쟁: 만주 사변(1931) → 만주국 수립 → 중·일 전쟁(1937) → 동남아시아 침략  \n  - 미국 등이 일본 팽창 막기 위해 석유 비롯한 군수 물자 수출 금지  \n- 전개  \n  - 진주만 기습(1941) → 미드웨이 해전 → 원자 폭탄 투하, 소련의 선전 포고 → 일본 항복(1945. 8. 15.)  \n\n#### 3) 인권 유린: 민간인 인권 유린 자행(강제 동원, 학살, 생체 실험 등)","rounds":[{"id":1,"title":"기본 개념","description":"짧은 답 10 · OX 10","guide":"1–10번은 짧은 답, 11–20번은 OX입니다.","questions":[{"type":"short","q":"1929년 미국에서 시작되어 전 세계로 퍼진 경제 위기는?","answers":["대공황"],"explanation":"1929년 미국의 주가 폭락은 기업 파산과 실업 증가, 세계 무역 위축으로 이어졌다."},{"type":"short","q":"미국이 대공황 극복을 위해 추진한 정책은?","answers":["뉴딜 정책"],"explanation":"문서 확인: 뉴딜 정책 → 사회 간접 자본 확충, 노동자 권익 보장"},{"type":"short","q":"국가·민족을 앞세워 개인의 자유와 권리를 억압하는 사상은?","answers":["전체주의"],"explanation":"전체주의는 국가·민족을 우선시하면서 개인의 자유와 권리를 억압하였다."},{"type":"short","q":"이탈리아 파시스트당을 이끈 인물은?","answers":["무솔리니"],"explanation":"문서 확인: 이탈리아: 무솔리니, 파시스트당"},{"type":"short","q":"독일 나치당을 이끈 인물은?","answers":["히틀러"],"explanation":"독일에서는 히틀러와 나치당을 중심으로 전체주의가 확산되었다."},{"type":"short","q":"일본에서 군사력을 앞세워 가속화된 사상·체제는?","answers":["군국주의"],"explanation":"일본에서는 경제 위기 속에 군국주의가 가속화되고 대외 침략이 확대되었다."},{"type":"short","q":"독일·이탈리아·일본이 맺은 반공 성격의 협정은?","answers":["방공 협정"],"explanation":"문서 확인: 독일, 이탈리아, 일본이 방공 협정 맺고 대외 침략 본격화"},{"type":"short","q":"1939년 독일이 침공하여 유럽 전쟁의 계기가 된 나라는?","answers":["폴란드"],"explanation":"문서 확인: 1) 유럽 전선: 독일이 폴란드 침공(1939) → 프랑스 점령 → 소련 침공 → 연합국의 공격으로 이탈리아, 독일 항복"},{"type":"short","q":"일본이 1931년 일으켜 만주국 수립으로 이어진 사건은?","answers":["만주 사변"],"explanation":"문서 확인: 일본의 침략 전쟁: 만주 사변(1931) → 만주국 수립 → 중·일 전쟁(1937) → 동남아시아 침략"},{"type":"short","q":"1941년 일본이 기습한 미국의 해군 기지는?","answers":["진주만"],"explanation":"문서 확인: 진주만 기습(1941) → 미드웨이 해전 → 원자 폭탄 투하, 소련의 선전 포고 → 일본 항복(1945. 8. 15.)"},{"type":"ox","q":"대공황은 1929년 미국 주식 가격 폭락을 계기로 발생하였다.","answers":["O"],"explanation":"주가 폭락은 기업 파산과 실업 증가로 이어졌다."},{"type":"ox","q":"대공황 시기 세계 무역 규모는 크게 증가하였다.","answers":["X"],"explanation":"기업 파산과 실업 증가 속에서 세계 무역 규모가 감소하였다."},{"type":"ox","q":"뉴딜 정책에는 사회 간접 자본 확충과 노동자 권익 보장이 포함되었다.","answers":["O"],"explanation":"미국은 국가의 경제 개입을 통해 위기 극복을 시도하였다."},{"type":"ox","q":"영국과 프랑스는 식민지 등과 경제적 유대를 강화하였다.","answers":["O"],"explanation":"영국은 파운드 블록과 영연방 유대를, 프랑스는 식민지와 블록 경제를 추진하였다."},{"type":"ox","q":"전체주의 국가는 침략 전쟁을 통해 해외 시장을 확보하려 하였다.","answers":["O"],"explanation":"국민 불만을 잠재우고 경제 위기를 타개하려는 목적이 있었다."},{"type":"ox","q":"독일은 프랑스를 점령한 뒤 소련을 침공하였다.","answers":["O"],"explanation":"문서는 폴란드 침공, 프랑스 점령, 소련 침공의 흐름을 제시한다."},{"type":"ox","q":"중·일 전쟁은 만주 사변보다 먼저 일어났다.","answers":["X"],"explanation":"만주 사변은 1931년, 중·일 전쟁은 1937년에 일어났다."},{"type":"ox","q":"미국 등은 일본의 팽창을 막으려고 석유 등 군수 물자 수출을 금지하였다.","answers":["O"],"explanation":"이러한 제재 속에서 일본은 진주만 기습을 감행하였다."},{"type":"ox","q":"일본은 원자 폭탄 투하와 소련의 선전 포고 이후 항복하였다.","answers":["O"],"explanation":"아시아·태평양 전쟁은 1945년 8월 일본의 항복으로 끝났다."},{"type":"ox","q":"제2차 세계 대전에서 민간인에 대한 인권 유린은 일어나지 않았다.","answers":["X"],"explanation":"강제 동원·학살·생체 실험 등 심각한 인권 유린이 자행되었다."}]},{"id":2,"title":"개념 연결","descript 광복을 위한 노력 | 교과서 54~59쪽 | PDF 30쪽","source":"> 5 일제 침략 전쟁과 광복을 위한 노력 | 교과서 54~59쪽 | PDF 30쪽  \n> 핵심 개념: 병참 기지화, 국가 총동원법, 징병, 징용, 민족 말살 정책  \n\n### 1. 병참 기지화 정책\n\n#### 1) 배경\n① 대공황 이후 일본, 만주, 한국을 블록으로 묶어 경제 위기 타개 시도  \n  → 만주는 농업과 원료 공급 지대, 한국은 군수 물자 보급 기지  \n② 한국의 값싼 노동력과 자원을 효율적 수탈하여 한반도를 침략 전쟁에 필요한 군수 물자를 공급하는 병참 기지(으)로 만들기 위함.  \n\n#### 2) 전개\n① 식민지 공업화: 1930년대 지하자원 풍부한 북부 지방 중심으로 광업 발달, 중화학 공업 공장 건설  \n② 중·일 전쟁 이후: 병참 기지화 정책 본격화, 군수 산업 위주 산업 개편, 소비재 생산 감소  \n\n#### 3) 영향: 산업 간 불균형 심화, 지역에 따른 공업 격차 심화\n\n### 2. 전쟁 동원 체제 구축\n\n#### 1) 중·일 전쟁 이후\n① 국가 총동원법 제정(1938)  \n② 일본에서 실시한 국민정신 총동원 운동을 한국에서도 실시  \n- 기존 행정 구역 바탕 조직  \n- 애국반: 말단 기구, 10집을 하나로 묶어 조직 → 정책 선전, 일상 통제  \n\n> [국가 총동원법(1938)]  \n> 제1조 국가 총동원이란 전시(전시에 준할 정도도 포함.)에 국방 목적을 달성하기 위해 국가의 전력을 가장 유효하게 발휘하도록 인적 및 물적 자원을 운용하는 것이다.  \n> 제4조 정부는 전시에 국가 총동원상 필요할 때는 칙령이 정하는 바에 따라 제국 신민을 징용하여 총동원 업무에 종사하게 할 수 있다.  \n> — 『조선 총독부 관보』 제3391호  \n\n#### 2) 한국인 강제 동원\n① 징병: 지원병제(1938), 학도 지원병제(1943), 징병제(1944)  \n② 징용: 국민 징용령(1939), 여자 정신 근로령(1944)  \n③ 일본군 ‘위안부’ 강제 동원: 비인간적인 구타, 고문, 성폭력 자행  \n\n#### 3) 물자 수탈\n① 산미 증식 계획 재시행, 식량 배급제, 공출 실시  \n② 각종 세금 신설, 위문 금품, 국방헌금 강요 → 친일 반민족 행위자들 적극 협력  \n\n### 3. 민족 말살 정책\n\n#### 1) 목적\n① 한국인의 민족의식을 말살하여 침략 전쟁에 동원하기 위함.  \n② ‘내선일체’, ‘일선동조론’을 주장하며 민족 말살 정책 시행  \n\n#### 2) 진행\n① ‘황국 신민 서사’ 암송: 일왕에 대한 충성 맹세문을 억지로 외우고 제창하게 함.  \n② 궁성요배: 일본 궁성을 향해 허리 굽혀 절하도록 강제함.  \n③ 신사 참배: 전국에 일본의 신과 조상을 숭배하는 신사를 세우고 참배를 강요  \n④ 소학교를 국민학교(‘황국 신민 학교’라는 의미)로 개명  \n\n#### 3) 우리말과 이름 금지\n① 학교, 관공서에서 한국어 사용 금지, 일본어 강요, 조선어 과목 사실상 폐지  \n② 『동아일보』, 『조선일보』 등 한글 신문 폐간, 조선어 학회 사건  \n③ 한국인의 성과 이름을/를 일본식으로 바꿀 것 강요  \n  → 거부하면 식량 및 물자 배급에서 제외, 자녀 학교 입학 금지 등","rounds":[{"id":1,"title":"기본 개념","description":"짧은 답 10 · OX 10","guide":"1–10번은 짧은 답, 11–20번은 OX입니다.","questions":[{"type":"short","q":"일제가 한국을 전쟁 물자 보급 기지로 만드는 정책은?","answers":["병참 기지화 정책","병참 기지화"],"explanation":"문서 확인: 중·일 전쟁 이후: 병참 기지화 정책 본격화, 군수 산업 위주 산업 개편, 소비재 생산 감소"},{"type":"short","q":"1930년대 광업과 중화학 공업이 집중된 한반도의 지역은?","answers":["북부 지방","북부","북부 지역"],"explanation":"문서 확인: 식민지 공업화: 1930년대 지하자원 풍부한 북부 지방 중심으로 광업 발달, 중화학 공업 공장 건설"},{"type":"short","q":"1938년 인적·물적 자원 동원의 근거로 제정한 법은?","answers":["국가 총동원법"],"explanation":"문서 확인: 국가 총동원법 제정(1938)"},{"type":"short","q":"10집을 하나로 묶어 일상 통제와 정책 선전에 이용한 말단 기구는?","answers":["애국반"],"explanation":"문서 확인: 애국반: 말단 기구, 10집을 하나로 묶어 조직 → 정책 선전, 일상 통제"},{"type":"short","q":"한국인에게 지원병제가 실시된 해는?","answers":["1938","1938년"],"explanation":"문서 확인: 국가 총동원법 제정(1938)"},{"type":"short","q":"한국인에게 징병제가 실시된 해는?","answers":["1944","1944년"],"explanation":"문서 확인: 징병: 지원병제(1938), 학도 지원병제(1943), 징병제(1944)"},{"type":"short","q":"1939년 노동력 동원과 관련하여 시행된 법령은?","answers":["국민 징용령"],"explanation":"문서 확인: 징용: 국민 징용령(1939), 여자 정신 근로령(1944)"},{"type":"short","q":"일왕에게 충성을 맹세하도록 암송을 강요한 글은?","answers":["황국 신민 서사"],"explanation":"문서 확인: ‘황국 신민 서사’ 암송: 일왕에 대한 충성 맹세문을 억지로 외우고 제창하게 함."},{"type":"short","q":"일본 궁성을 향해 절하도록 강요한 행위는?","answers":["궁성요배"],"explanation":"문서 확인: 궁성요배: 일본 궁성을 향해 허리 굽혀 절하도록 강제함."},{"type":"short","q":"일제가 소학교를 바꿔 부른 이름은?","answers":["국민학교"],"explanation":"문서 확인: 소학교를 국민학교(‘황국 신민 학교’라는 의미)로 개명"},{"type":"ox","q":"대공황 이후 일본은 일본·만주·한국을 블록으로 묶으려 하였다.","answers":["O"],"explanation":"만주는 농업·원료 공급 지대, 한국은 군수 물자 보급 기지로 삼으려 하였다."},{"type":"ox","q":"병참 기지화 정책은 한국의 값싼 노동력과 자원 수탈을 목적으로 하였다.","answers":["O"],"explanation":"침략 전쟁에 필요한 군수 물자를 공급하려는 정책이었다."},{"type":"ox","q":"중·일 전쟁 이후 산업은 군수 산업 위주로 개편되었다.","answers":["O"],"explanation":"병참 기지화가 본격화되면서 소비재 생산은 감소하였다."},{"type":"ox","q":"병참 기지화는 산업 간 불균형과 지역 공업 격차를 해소하였다.","answers":["X"],"explanation":"산업 간 불균형과 지역에 따른 공업 격차를 심화하였다."},{"type":"ox","q":"일제는 식량 배급제와 공출을 실시하였다.","answers":["O"],"explanation":"산미 증식 계획 재시행과 함께 전쟁에 필요한 식량을 수탈하였다."},{"type":"ox","q":"국방헌금과 위문 금품은 전혀 강요되지 않았다.","answers":["X"],"explanation":"일제는 각종 세금과 함께 국방헌금·위문 금품을 강요하였다."},{"type":"ox","q":"민족 말살 정책은 한국인의 민족의식을 없애 전쟁에 동원하려는 목적이었다.","answers":["O"],"explanation":"‘내선일체’와 ‘일선동조론’을 내세워 동화를 강요하였다."},{"type":"ox","q":"일제는 신사를 세우고 한국인에게 참배를 강요하였다.","answers":["O"],"explanation":"  전쟁에 동원하려 하였다."},{"type":"short","q":"[황국 신민 서사의 내용] 빈칸에 들어갈 말을 쓰세요.\n______에 대한 충성을 맹세하는 글을 억지로 외우게 하였다.","answers":["일왕"],"explanation":"황국 신민 서사의 내용: 일왕에 대한 충성을 맹세하는 글을 억지로 외우게 하였다."},{"type":"short","q":"[궁성요배의 대상] 빈칸에 들어갈 말을 쓰세요.\n일본의 ______을 향해 허리를 굽혀 절하게 하였다.","answers":["궁성"],"explanation":"궁성요배의 대상: 일본의 궁성을 향해 허리를 굽혀 절하게 하였다."},{"type":"short","q":"[한국어 억압의 현장] 빈칸에 들어갈 말을 쓰세요.\n학교와 ______에서 한국어 사용을 금지하고 일본어를 강요하였다.","answers":["관공서"],"explanation":"한국어 억압의 현장: 학교와 관공서에서 한국어 사용을 금지하고 일본어를 강요하였다."},{"type":"short","q":"[일본식 성명 강요의 제재] 빈칸에 들어갈 말을 쓰세요.\n거부하면 식량·물자 ______에서 제외하는 등 불이익을 주었다.","answers":["배급"],"explanation":"일본식 성명 강요의 제재: 거부하면 식량·물자 배급에서 제외하는 등 불이익을 주었다."}]}]},{"id":16,"title":"03 1930년대 무장 투쟁","meta":"5 일제 침략 전쟁과 광복을 위한 노력 | 교과서 60~61쪽 | PDF 32쪽","source":"> 5 일제 침략 전쟁과 광복을 위한 노력 | 교과서 60~61쪽 | PDF 32쪽  \n> 핵심 개념: 한국 독립군, 조선 혁명군, 조선 민족 혁명당, 조선 의용대  \n\n### 1. 1930년대 만주 지역 무장 투쟁\n\n#### 1) 중국군과의 연대\n① 배경  \n- 만주 사변(1931), 만주국 수립 이후 중국 내 항일 감정 고조  \n- 독립군과 중국인 부대가 연합하여 무장 투쟁 전개  \n\n② 한국 독립군의 활동  \n- 조직  \n  - 북만주에서 한국 독립당이 한국 독립군 결성  \n- 활동  \n  - 지청천의 지휘로 중국군과 연합, 쌍성보와 대전자령 전투 등 승리  \n- 이동  \n  - 일제 만주 장악 후 대한민국 임시 정부 요청으로 상당수 중국 관내 이동  \n\n③ 조선 혁명군의 활동  \n- 조직  \n  - 남만주에서 조선 혁명당이 조선 혁명군 편성  \n- 활동  \n  - 양세봉의 지휘로 중국군과 연합, 영릉가와 흥경성 일대에서 승리  \n- 약화  \n  - 양세봉이 일제 밀정에게 살해된 뒤 세력 약화  \n\n> [한국 독립군과 중국군의 합의]  \n> 1. 한·중 양군은 최악의 상황이 오는 경우에도 장기간 항전할 것을 맹세한다.  \n> 3. 전시의 후방 전투 훈련은 한국 장교가 맡고 한국군에 필요한 군수품은 중국군이 공급한다.  \n> — 한국광복군 사령부, 『광복』 2  \n\n#### 2) 동북 항일 연군\n① 배경: 일제 만주 침략 후 중국 공산당 내 반일 통일 전선 조직 주장 제기 → 동북 항일 연군 조직  \n② 활동  \n- 조국 광복회 조직: 동북 항일 연군의 한인 유격대, 함경도 일대의 사회주의·민족주의 세력 통합하여 조직, 국내 일제 행정 기관 공격(보천보 전투, 1937)  \n- 동북 항일 연군의 한국인 유격대는 일제의 공격으로 타격 입자 소련으로 이동  \n\n### 2. 1930년대 중국 관내 무장 투쟁\n\n#### 1) 조선 민족 혁명당\n① 배경: 여러 독립운동가가 관내로 모이면서 독립운동의 방법, 사상 갈등 발생  \n② 창당: 통일된 항일 전선을 만들어 독립운동 역량 집결 → 난징에서 창당(1935)  \n③ 의의: 중국 관내 최대 규모의 민족 통일 전선 정당  \n④ 한계: 김구 등 불참, 이후 민족주의 세력 일부 이탈  \n\n추가 자료) 민족 혁명당 당의(1935)  \n\n> 본당은 혁명적 수단을 가지고 원수 일본의 침략 세력을 박멸하고 5천 년 독립 자주하여 온 국토와 주권을 회복하고, 정치·경제·교육의 평등에 기초를 둔 진정한 민주 공화국을 건설하고, 국민 전체의 생활 평등을 확보하며, 나아가 세계 인류의 평등과 행복을 촉진함.  \n\n#### 2) 조선 의용대\n① 창설: 중·일 전쟁 이후 조선 민족 혁명당이 조선 민족 전선 연맹 결성  \n  → 중국 국민당 정부 지원으로 조선 의용대 창설(1938)  \n② 활동: 정보 수집, 포로 심문, 후방 교란 등 활동  \n③ 의의: 중국 관내에서 결성한 최초의 한국인 무장 단체  \n④ 조선 의용대 화북 지대: 조선 의용대 일부가 화북 이동, 호가장 전투에서 성과  \n\n추가 자료) 조선 의용대 성립 선언(1938)  \n\n> 우리들 조선 혁명당원은 모름지기 이 정의로운 전쟁에 참여하고 조국의 독립을 쟁취해야 할 것이다. 그리하여 우선 ‘조선 민족 전선 연맹’의 깃발 아래 일치단결하고 …… 오늘 성립한 조선 의용대의 임무는 매우 중대하다 할 수 있다. 우리는 식민지 노예가 되기를 원하지 않는다. 천수백만 조선 동포를 조선 의용대의 깃발 아래 모아야 할 것이다.","rounds":[{"id":1,"title":"기본 개념","description":"짧은 답 10 · OX 10","guide":"1–10번은 짧은 답, 11–20번은 OX입니다.","questions":[{"type":"short","q":"북만주에서 한국 독립당이 결성한 군대는?","answers":["한국 독립군"],"explanation":"문서 확인: 북만주에서 한국 독립당이 한국 독립군 결성"},{"type":"short","q":"한국 독립군을 지휘하여 쌍성보·대전자령 전투에서 승리한 인물은?","answers":["지청천"],"explanation":"문서 확인: 지청천의 지휘로 중국군과 연합, 쌍성보와 대전자령 전투 등 승리"},{"type":"short","q":"남만주에서 조선 혁명당이 편성한 군대는?","answers":["조선 혁명군"],"explanation":"문서 확인: 남만주에서 조선 혁명당이 조선 혁명군 편성"},{"type":"short","q":"조선 혁명군을 지휘하여 영릉가·흥경성 일대에서 승리한 인물은?","answers":["양세봉"],"explanation":"문서 확인: 양세봉의 지휘로 중국군과 연합, 영릉가와 흥경성 일대에서 승리"},{"type":"short","q":"중국 공산당의 반일 통일 전선 흐름에서 조직된 연합 부대는?","answers":["동북 항일 연군"],"explanation":"문서 확인: 배경: 일제 만주 침략 후 중국 공산당 내 반일 통일 전선 조직 주장 제기 → 동북 항일 연군 조직"},{"type":"short","q":"동북 항일 연군의 한인 유격대 등이 국내 세력과 함께 조직한 단체는?","answers":["조국 광복회"],"explanation":"문서 확인: 조국 광복회 조직: 동북 항일 연군의 한인 유격대, 함경도 일대의 사회주의·민족주의 세력 통합하여 조직, 국내 일제 행정 기관 공격(보천보 전투, 1937)"},{"type":"short","q":"1937년 한인 유격대가 국내의 일제 행정 기관을 공격한 전투는?","answers":["보천보 전투"],"explanation":"문서 확인: 조국 광복회 조직: 동북 항일 연군의 한인 유격대, 함경도 일대의 사회주의·민족주의 세력 통합하여 조직, 국내 일제 행정 기관 공격(보천보 전투, 1937)"},{"type":"short","q":"1935년 난징에서 결성한 민족 통일 전선 정당은?","answers":["조선 민족 혁명당"],"explanation":"문서 확인: 창설: 중·일 전쟁 이후 조선 민족 혁명당이 조선 민족 전선 연맹 결성"},{"type":"short","q":"1938년 중국 관내에서 창설된 최초의 한국인 무장 단체는?","answers":["조선 의용대"],"explanation":"문서 확인: → 중국 국민당 정부 지원으로 조선 의용대 창설(1938)"},{"type":"short 합\n\n#### 1) 통합 노력\n① 한국 독립당  \n- 한국 광복 운동 단체 연합회 내 3개 정당 합당  \n- 위원장 김구, 대한민국 임시 정부의 여당 역할  \n\n② 통합 노력  \n- 김구을/를 주석으로 하는 단일 지도 체제 마련(1940)  \n- 김원봉 등 민족 혁명당, 사회주의 계열 인사 합류(1942)  \n- 화북의 조선 독립 동맹과 통일 전선 모색  \n\n#### 2) 대한민국 건국 강령(1941)\n① 내용: 조소앙의 삼균주의에 기초, 민주 공화정 수립, 토지 개혁 등  \n\n② 영향: 대한민국 정부 수립, 제헌 헌법 제정에 영향  \n\n### 2. 한국광복군의 활동\n\n#### 1) 창설: 대한민국 임시 정부의 정규군으로 한국광복군 창설(1940)\n① 지청천 사령관, 김원봉 등 조선 의용대 일부 합류  \n\n② 대일 선전 성명서 발표(1941): 한국광복군이 연합국의 일원으로 독립 전쟁을 지속하고 있다는 것을 세계에 알림.  \n\n#### 2) 활동\n① 미얀마·인도 전선에서 영국군과 공동 작전  \n\n② 국내 진공 작전: 미국과 협약 맺어 독수리 작전 계획 → 일제의 항복으로 취소  \n\n> [국내 진공 작전의 취소]  \n> ‘아! 왜적이 항복!’ 이것은 내게 기쁜 소식이라기보다는 하늘이 무너지는 듯한 일이었다. …… 산둥에서 미국 잠수함에 태워 본국으로 들여보내서 국내의 중요한 곳을 파괴하거나 점령한 뒤에 미국 비행기로 무기를 운반할 계획까지도 미국 육군성과 다 약속이 되어 있었다. 그런데 한 번 해 보지도 못하고 왜적이 항복하였으니 ……  \n> — 김구, 『백범일지』  \n\n### 3. 독립을 준비한 다양한 세력\n\n#### 1) 화북\n① 결성: 중국 화북 지역에서 한국인 사회주의자 중심으로 화북 조선 독립 동맹 결성(1942)  \n\n② 조선 의용군: 조선 의용대 화북 지대 개편, 옌안에서 팔로군과 함께 전투  \n\n③ 건국 강령: 민주 공화국 수립, 남녀평등, 토지 분배, 의무 교육 실시 등  \n\n#### 2) 국내\n① 결성: 여운형 중심, 국내 민족주의자와 사회주의자 참여로 조선 건국 동맹 결성  \n\n② 활동: 전국으로 조직 확대, 일제 침략 전쟁 방해, 국내외 무장봉기 계획  \n\n③ 강령: 일제 타도를 위한 대동단결, 민주주의 국가 건설 목표  \n\n#### 3) 미주\n① 결성: 미주 지역 9대 한인 단체 연합해 재미 한족 연합 위원회 결성  \n\n② 활동  \n- 대한민국 임시 정부 재정 후원, 미국 승인 노력, 한인 국방 경위대 조직  \n- 냅코(NAPKO) 작전 계획(일본의 항복으로 실행되지 못함.)  \n\n### 4. 국제 사회의 대응\n\n- 1943  \n  - 카이로 회담  \n  - 한국 독립을 최초로 논의  \n- 1945. 2.  \n  - 얄타 회담  \n  - 소련의 대일본전 참전, 민주 세력에 의한 임시 정부 구성  \n- 1945. 7.  \n  - 포츠담 회담  \n  - 일본의 무조건 항복 촉구, 한국의 독립 재확인  \n- 1945. 8.  \n  - 일본 항복","rounds":[{"id":1,"title":"기본 개념","description":"짧은 답 10 · OX 10","guide":"1–10번은 짧은 답, 11–20번은 OX입니다.","questions":[{"type":"short","q":"1940년 3개 정당의 합당으로 만들어져 임시 정부의 여당 역할을 한 정당은?","answers":["한국 독립당"],"explanation":"한국 독립당은 김구가 위원장을 맡았으며 대한민국 임시 정부의 여당 역할을 하였다."},{"type":"short","q":"1940년 대한민국 임시 정부의 주석이 된 인물은?","answers":["김구"],"explanation":"문서 확인: 위원장 김구, 대한민국 임시 정부의 여당 역할"},{"type":"short","q":"대한민국 건국 강령의 바탕이 된 조소앙의 사상은?","answers":["삼균주의"],"explanation":"문서 확인 체가 연합하여 결성하였다.","answers":["9","9개","아홉"],"explanation":"재미 한족 연합 위원회의 기반: 미주의 9대 한인 단체가 연합하여 결성하였다."},{"type":"short","q":"[카이로 회담의 개최 연도] 빈칸에 들어갈 말을 쓰세요.\n한국 독립을 최초로 논의한 회담은 ______년에 열렸다.","answers":["1943","1943년"],"explanation":"카이로 회담의 개최 연도: 한국 독립을 최초로 논의한 회담은 1943년에 열렸다."},{"type":"short","q":"[얄타 회담의 대일전 논의] 빈칸에 들어갈 말을 쓰세요.\n1945년 2월 ______의 대일본전 참전 등이 논의되었다.","answers":["소련"],"explanation":"얄타 회담의 대일전 논의: 1945년 2월 소련의 대일본전 참전 등이 논의되었다."},{"type":"short","q":"[포츠담 회담의 대일 요구] 빈칸에 들어갈 말을 쓰세요.\n1945년 7월 일본의 ______을 촉구하였다.","answers":["무조건 항복"],"explanation":"포츠담 회담의 대일 요구: 1945년 7월 일본의 무조건 항복을 촉구하였다."}]}]},{"id":18,"title":"01 냉전 체제와 동아시아","meta":"1 8·15 광복과 대한민국 정부의 수립 | 교과서 72~73쪽 | PDF 36쪽","source":"> 1 8·15 광복과 대한민국 정부의 수립 | 교과서 72~73쪽 | PDF 36쪽  \n> 핵심 개념: 유엔(국제 연합), 냉전, 중화 인민 공화국, 샌프란시스코 강화 조약  \n\n### 1. 유엔(국제 연합)의 출범\n\n- 창설  \n  - 국제 평화 유지와 전쟁 방지를 목표로 국제 연합 창설(1945. 10.)  \n- 특징  \n  - 안전 보장 이사회 설치  \n  - 5개 상임 이사국 거부권 부여 → 한 국가의 독주 견제  \n  - 유엔군 파견: 국제 분쟁에서 도발국 제재  \n- 한계  \n  - 냉전 체제 강화로 미국과 소련, 회원국 간 다양한 이해관계 충돌 → 유엔의 평화 유지 노력에 한계  \n\n### 2. 냉전 체제의 성립\n\n#### 1) 냉전: 미국 중심의 자본주의 진영과 소련 중심의 공산주의 진영이 직접 무력을 사용하지는 않지만 세계 곳곳에서 치열하게 대립\n\n#### 2) 전개: 제2차 세계 대전 이후 소련 영향력 확대 → 미국이 트루먼 독트린, 마셜 플랜 발표 → 소련, 코민포름과 코메콘 조직, 양 진영 대립 심화, 소련의 베를린 봉쇄 이후 본격화\n\n#### 〈추가 자료〉 양 진영의 대립\n- 자본주의 진영  \n  - 중심국: 미국  \n  - 경제: 마셜 플랜  \n  - 군사: 북대서양 조약 기구(NATO)  \n- 공산주의 진영  \n  - 중심국: 소련  \n  - 경제: 코메콘  \n  - 군사: 바르샤바 조약 기구(WTO)  \n\n### 3. 동아시아의 냉전과 열전\n\n#### 1) 중국의 공산화\n- 일본 항복 후 내전 발발(제2차 국·공 내전)  \n- → 공산당이 국·공 내전에서 승기를 잡음.  \n- →  \n  - 중화 인민 공화국 수립 선포(1949)  \n  - 국민당 정부 타이완 이동  \n\n#### 2) 일본의 국제 사회 복귀\n① 제2차 세계 대전 이후의 일본  \n- 미국 중심으로 연합국 최고 사령부가 통치  \n- 평화 헌법 제정: 민주주의와 비무장 원칙  \n- 일왕 신격화 금지  \n- 극동 국제 군사 재판 개최: 전쟁 범죄자 처벌  \n\n② 샌프란시스코 강화 조약  \n- 배경: 동아시아에서 공산주의 세력 강화 → 미국이 일본을 동아시아의 반공 기지로 만들고자 함.  \n- 내용: 일본의 주권 회복, 경제 부흥 지원  \n\n③ 미·일 안보 조약: 동아시아에서 미국의 영향력 확대  \n\n#### 3) 베트남의 공산화: 베트남 전쟁을 거쳐 공산주의 국가로 통일\n\n> [〈추가 자료〉 평화 헌법]  \n> ① 일본국민은 정의와 질서를 기초로 하는 국제 평화를 성실히 바라고 추구하며, 국제 분쟁을 해결하는 수단으로써 국권이 발동되는 전쟁과 무력에 의한 위협 또는 무력행사를 영구히 포기한다.  \n> ② 전항의 목적을 달성하기 위하여 육·해·공군, 그 밖의 전력을 보유하지 않는다. 국가 교전권은 인정하지 않는다.  \n\n▶ 일본에서 제정된 평화 헌법으로 전쟁과 군대, 교전권 포기 등을 규정하고 있다.","rounds":[{"id":1,"title":"기본 개념","description":"짧은 답 10 · OX 10","guide":"1–10번은 짧은 답, 11–20번은 OX입니다.","questions":[{"type":"short","q":"1945년 10월 국제 평화 유지와 전쟁 방지를 목표로 창설한 기구는?","answers":["국제 연합","유엔","UN"],"explanation":"문서 확인: 1. 유엔(국제 연합)의 출범"},{"type":"short","q":"유엔의 5개 상임 이사국이 속한 이사회는?","answers":["안전 보장 이사회","안보리"],"explanation":"안전 보장 이사회에는 5개 상임 이사국이 있으며 이들에게 거부권이 부여되었다."},{"type":"short","q":"유엔 안전 보장 이사회의 상임 이사국에 부여된 특별한 권한은?","answers":["거부권"],"explanation":"문서 확인: 5개 상임 이사국 거부권 부여 → 한 국가의 독주 견제"},{"type":"short","q":"미국과 소련을 중심으로 두 진영이 대립한 체제는?","answers":["냉전","냉전 체제"],"explanation":"문서 확인: 냉전 체제 강화로 미국과 소련, 회원국 간 다양한 이해관계 충돌 → 유엔의 평화 유지 노력에 한계"},{"type":"short","q":"소련의 영향력 확대에 맞서 미국이 발표한 대외 정책 선언은?","answers":["트루먼 독트린"],"explanation":"문서 확인: 2) 전개: 제2차 세계 대전 이후 소련 영향력 확대 → 미국이 트루먼 독트린, 마셜 플랜 발표 → 소련, 코민포름과 코메콘 조직, 양 진영 대립 심화, 소련의 베를린 봉쇄 이후 본격화"},{"type":"short","q":"미국이 유럽의 경제 부흥을 지원한 계획은?","answers":["마셜 플랜","마샬 플랜"],"explanation":"문서 확인: 2) 전개: 제2차 세계 대전 이후 소련 영향력 확대 → 미국이 트루먼 독트린, 마셜 플랜 발표 → 소련, 코민포름과 코메콘 조직, 양 진영 대립 심화, 소련의 베를린 봉쇄 이후 본격화"},{"type":"short","q":"소련 중심 공산주의 진영의 경제 협력 기구는?","answers":["코메콘"],"explanation":"문서 확인: 2) 전개: 제2차 세계 대전 이후 소련 영향력 확대 → 미국이 트루먼 독트린, 마셜 플랜 발표 → 소련, 코민포름과 코메콘 조직, 양 진영 대립 심화, 소련의 베를린 봉쇄 이후 본격화"},{"type":"short","q":"미국 중심 자본주의 진영의 군사 기구는?","answers":["북대서양 조약 기구","NATO","나토"],"explanation":"문서 확인: 군사: 북대서양 조약 기구(NATO)"},{"type":"short","q":"1949년 중국 공산당이 수립을 선포한 국가는?","answers":["중화 인민 공화국"],"explanation":"문서 확인: 중화 인민 공화국 수립 선포(1949)"},{"type":"short","q":"일본의 주권 회복을 인정한 강화 조약은?","answers":["샌프란시스코 강화 조약"],"explanation":"샌프란시스코 강화 조약으로 일본의 주권 회복을 인정하였다."},{"type":"ox","q":"유엔은 국제 분쟁에서 도발국을 제재하기 위해 유엔군을 파견할 수 있었다.","answers":["O"],"explanation":"국제 평화 유지를 위한 수단으로 유엔군 파견이 제시되어 있다."},{"type":"ox","q":"냉전 시기에도 유엔 회원국 사이에는 이 의 군사 기구: 바르샤바 조약 기구가 소련 중심의 군사 기구였다."},{"type":"short","q":"[냉전 본격화의 계기] 빈칸에 들어갈 말을 쓰세요.\n소련의 ______ 이후 대립이 본격화되었다.","answers":["베를린 봉쇄"],"explanation":"냉전 본격화의 계기: 소련의 베를린 봉쇄 이후 대립이 본격화되었다."},{"type":"short","q":"[중국 공산당의 국가 수립] 빈칸에 들어갈 말을 쓰세요.\n중화 인민 공화국 수립을 선포한 해는 ______이다.","answers":["1949","1949년"],"explanation":"중국 공산당의 국가 수립: 중화 인민 공화국 수립을 선포한 해는 1949이다."},{"type":"short","q":"[국민당 정부의 이동] 빈칸에 들어갈 말을 쓰세요.\n국·공 내전에서 밀린 국민당 정부는 ______으로 이동하였다.","answers":["타이완","대만"],"explanation":"국민당 정부의 이동: 국·공 내전에서 밀린 국민당 정부는 타이완으로 이동하였다."},{"type":"short","q":"[전후 일본의 점령 통치] 빈칸에 들어갈 말을 쓰세요.\n______ 중심의 연합국 최고 사령부가 일본을 통치하였다.","answers":["미국"],"explanation":"전후 일본의 점령 통치: 미국 중심의 연합국 최고 사령부가 일본을 통치하였다."},{"type":"short","q":"[일본의 평화 헌법] 빈칸에 들어갈 말을 쓰세요.\n민주주의와 ______ 원칙을 담아 제정되었다.","answers":["비무장"],"explanation":"일본의 평화 헌법: 민주주의와 비무장 원칙을 담아 제정되었다."},{"type":"short","q":"[전후 일본의 전범 재판] 빈칸에 들어갈 말을 쓰세요.\n전쟁 범죄자를 처벌하기 위해 ______을 개최하였다.","answers":["극동 국제 군사 재판"],"explanation":"전후 일본의 전범 재판: 전쟁 범죄자를 처벌하기 위해 극동 국제 군사 재판을 개최하였다."},{"type":"short","q":"[샌프란시스코 강화 조약의 배경] 빈칸에 들어갈 말을 쓰세요.\n미국은 일본을 동아시아의 ______로 삼으려 하였다.","answers":["반공 기지"],"explanation":"샌프란시스코 강화 조약의 배경: 미국은 일본을 동아시아의 반공 기지로 삼으려 하였다."},{"type":"short","q":"[미·일 안보 조약의 영향] 빈칸에 들어갈 말을 쓰세요.\n동아시아에서 ______의 영향력이 확대되었다.","answers":["미국"],"explanation":"미·일 안보 조약의 영향: 동아시아에서 미국의 영향력이 확대되었다."}]}]},{"id":19,"title":"02 8·15 광복","meta":"1 8·15 광복과 대한민국 정부의 수립 | 교과서 74~75쪽 | PDF 38쪽","source":"> 1 8·15 광복과 대한민국 정부의 수립 | 교과서 74~75쪽 | PDF 38쪽  \n> 핵심 개념: 8·15 광복, 조선 건국 준비 위원회, 조선 인민 공화국, 38도선, 군정  \n\n### 1. 8·15 광복\n\n#### 1) 8·15 광복: 일본의 무조건 항복으로 광복을 맞이함(1945. 8. 15.).\n\n#### 2) 광복의 배경\n① 한국인들의 끊임없는 독립 노력을 국제 사회가 인정  \n\n② 연합국 승리의 결과 → 정부 수립 과정에서 미국, 소련의 영향을 받음.  \n\n### 2. 정부 수립을 위한 노력\n\n#### 1) 조선 건국 준비 위원회(건준)\n① 조직: 여운형이 조선 건국 동맹 중심으로 좌익과 우익 아울러 조직  \n\n② 사회 안정 노력  \n- 전국에 지부 설치, 치안대 조직  \n- 식량과 생활필수품 확보  \n\n③ 조선 인민 공화국 수립 선포(1945. 9.)  \n- 미군이 남한 진주할 때 한국인을 대표해 대등한 입장에서 교섭하기 위함.  \n- 각 지부를 인민 위원회로 전환  \n- 이 과정에서 좌익 세력의 주도권 장악, 일부 우익 세력 건준 탈퇴  \n\n#### 2) 이외 정당 및 단체\n- 한국 민주당  \n  - 김성수·송진우 등 건준 활동에 비판적인 우익 세력 중심  \n- 독립 촉성 중앙 협의회  \n  - 미국에서 돌아온 이승만이/가 지지 세력을 모아 조직  \n- 한국 독립당  \n  - 김구 등 대한민국 임시 정부의 요인 개인 자격 귀국 후 활동  \n\n### 3. 38도선 설정과 남북 분단\n\n#### 1) 배경\n① 소련 참전: 소련이 일본에 선전 포고(1945. 8.) → 만주와 한반도의 일본군과 전투  \n\n② 38도선 분할: 미국이 소련의 남하를 막기 위해 38도선을/를 기준으로 남과 북에 양국이 각각 진주, 일본군 무장 해제 제안 → 소련이 제안 수용  \n\n> [미·소의 한반도 분할]  \n> 우리들은 소련이 동의하지 않을 경우 미군이 현실적으로 진주할 수 있는 것보다 더 북쪽이었지만 38도선을 건의하였다. 미군 관할 지역 내에 한국의 수도를 포함하는 것이 중요하다고 생각했기 때문에 그렇게 하였다. …… 소련이 38도선을 받아들였을 당시 본인은 약간 놀랐던 것으로 기억된다. 왜냐하면 본인은 이 지역에서 우리의 군사력에 비추어 볼 때 소련은 훨씬 남쪽의 선을 주장할 것이라고 생각했기 때문이다.  \n> — 『미국의 대외 관계』 6  \n\n▶ 38도선은 분할 당시에는 단순한 군사 분리선으로 통행에 큰 지장이 있지는 않았다. 하지만 이후 남북 간의 대립이 심해지면서 점차 통행이 힘들어지게 되었다.  \n\n#### 2) 결과\n- 38도선 이남  \n  - 미군 통치: 직접 통치(군정청 설치)  \n  - 일제의 식민 통치 기구(조선 총독부 관료와 경찰 조직) 유지  \n  - 대한민국 임시 정부, 조선 인민 공화국 등 부인  \n- 38도선 이북  \n  - 소련군 통치: 간접 통치(각 지역의 인민 위원회에 행정권 이양)  \n  - 소련에 우호적 정부 수립 추구 → 김일성 등 공산주의자 지원","rounds":[{"id":1,"title":"기본 개념","description":"짧은 답 10 · OX 10","guide":"1–10번은 짧은 답, 11–20번은 OX입니다.","questions":[{"type":"short","q":"일본 항복으로 광복을 맞이한 해는?","answers":["1945","1945년"],"explanation":"문서 확인: 1) 8·15 광복: 일본의 무조건 항복으로 광복을 맞이함(1945. 8. 15.)."},{"type":"short","q":"8·15 광복 직후 조선 건국 준비 위원회 조직을 주도한 인물은?","answers":["여운형"],"explanation":"문서 확인: 조직: 여운형이 조선 건국 동맹 중심으로 좌익과 우익 아울러 조직"},{"type":"short","q":"건국 준비 위원회 조직의 바탕이 된 국내 비밀 단체는?","answers":["조선 건국 동맹"],"explanation":"문서 확인: 조직: 여운형이 조선 건국 동맹 중심으로 좌익과 우익 아울러 조직"},{"type":"short","q":"조선 건국 준비 위원회의 약칭은?","answers":["건준"],"explanation":"문서 확인: 1) 조선 건국 준비 위원회(건준)"},{"type":"short","q":"건준이 사회 질서 유지를 위해 조직한 치안 담당 조직은?","answers":["치안대"],"explanation":"문서 확인: 전국에 지부 설치, 치안대 조직"},{"type":"short","q":"1945년 9월 수립이 선포된, 건준과 연결되는 정치 조직은?","answers":["조선 인민 공화국"],"explanation":"문서 확인: 조선 인민 공화국 수립 선포(1945. 9.)"},{"type":"short","q":"이승만이 귀국 후 지지 세력을 모아 조직한 단체는?","answers":["독립 촉성 중앙 협의회"],"explanation":"이승만은 미국에서 귀국한 후 지지 세력을 모아 독립 촉성 중앙 협의회를 조직하 신탁 통치, 제1차 미·소 공동 위원회  \n\n### 1. 모스크바 3국 외상 회의\n\n#### 1) 개최: 미·영·소 3국 외무 장관이 모스크바에서 한국 독립 문제 협의(1945. 12.)\n\n#### 2) 결정 내용\n- 각국의 주장  \n  - 미국: 신탁 통치안 제출  \n  - 소련: 임시 정부 수립을 내용으로 하는 안 제출  \n- 결론  \n  - 미국과 소련의 안 절충, 한반도에 민주주의 임시 정부 수립, 미·소 공동 위원회 설치, 최대 5년간의 신탁 통치  \n\n> [모스크바 3국 외상 회의 결정 사항]  \n> 1. 조선을 독립국으로 재건하고, 민주주의 원칙 위에서 발전하기 위한 조건들을 창출하며, 장기간에 걸친 일본 통치의 악독한 결과를 최대한 신속히 청산하기 위해 조선 민주주의 임시 정부를 수립한다.  \n> 2. 조선 임시 정부의 형성을 돕기 위하여, 그리고 적절한 방책들을 사전에 정교화하기 위하여 남조선 미군 사령부 대표들과 북조선 사령부 대표들로 공동 위원회를 조직한다.  \n> 3. …… 공동 위원회의 제안은 조선 임시 정부와 협의 후 5년 이내를 기한으로 하는 조선에 대한 4개국 신탁 통치의 협정을 작성하기 위하여 미·소·영·중 각국 정부의 공동 심의용으로 제출될 것이다.  \n\n### 2. 신탁 통치 문제를 둘러싼 좌우의 대립\n\n- 국내 언론의 오보와 신탁 통치 부분 집중 부각  \n- → 좌익과 우익, 중도 세력 모두 반탁 운동 전개  \n- → 임시 정부 수립 등 모스크바 3국 외상 회의의 모든 결정 사항 발표  \n- → 좌익 세력이 결정 사항에 대한 총체적 지지로 입장 변경  \n- → 우익과 좌익 세력 대립 심화  \n\n- 좌익: 좌익은 처음에는 신탁 통치에 반대하였으나, 회의 내용이 알려지자 총체적 지지를 밝혔다.  \n- 우익: 우익은 신탁 통치안에 절대 반대하였다.  \n\n### 3. 제1차 미·소 공동 위원회\n\n#### 1) 내용: 민주주의 임시 정부 수립 방안 논의\n\n#### 2) 미·소의 대립\n- 미국  \n  - 참여를 희망하는 모든 정당과 사회단체 포함 주장  \n- 소련  \n  - 모스크바 3국 외상 회의 결정을 지지하는 정당과 사회단체만 참여 주장  \n\n#### 3) 결과: 대립으로 협상 결렬, 무기한 휴회\n\n추가 자료) 제1차 미·소 공동 위원회에서 미·소의 대립  \n\n> 소련 측은 즉 모스크바 협정에 반대한 조선의 정당을 임시 정부로부터 제외하라는 요구로 신탁 통치 반대 운동에 대항하였다. 미국 측에서는 소련의 요구는 의사 표시의 자유를 말살하려는 것이라고 반대하였다. 이에 이르러 위원회는 몇 주간 걸친 회의 끝에 지난주에 서울에서 결렬되었다.  \n> — 『중앙신문』, 1946. 5. 24.","rounds":[{"id":1,"title":"기본 개념","description":"짧은 답 10 · OX 10","guide":"1–10번은 짧은 답, 11–20번은 OX입니다.","questions":[{"type":"short","q":"1945년 12월 한국 독립 문제를 논의한 회의는?","answers":["모스크바 3국 외상 회의","모스크바 삼국 외상 회의"],"explanation":"문서 확인: 1. 모스크바 3국 외상 회의"},{"type":"short","q":"모스크바 3국 외상 회의가 열린 도시는?","answers":["모스크바"],"explanation":"문서 확인: 1. 모스크바 3국 외상 회의"},{"type":"short","q":"미국·소련과 함께 모스크바 외상 회의에 참가한 나라는?","answers":["영국"],"explanation":"모스크바 회의에 참가한 3국은 미국·영국·소련이다."},{"type":"short","q":"모스크바 회의에서 신탁 통치안을 제출한 나라는?","answers":["미국"],"explanation":"문서 확인: 미국: 신탁 통치안 제출"},{"type":"short","q":"모스크바 회의에서 임시 정부 수립안을 제출한 나라는?","answers
